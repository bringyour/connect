              promoted:
                type: boolean
              match_distance:
                type: integer
        locations:
          type: array
          items:
            type: object
            properties:
              location_id:
                description: udid
                type: string
              location_type:
                type: string
                enum:
                  - city
                  - region
                  - country
              name:
                type: string
              city:
                type: string
              city_location_id:
                description: udid
                type: string
              region:
                type: string
              region_location_id:
                description: udid
                type: string
              country:
                type: string
              country_location_id:
                description: udid
                type: string
              country_code:
                type: string
              provider_count:
                type: integer
              match_distance:
                type: integer
              stable:
                type: boolean
              strong_privacy:
                type: boolean
        devices:
          type: array
          items:
            type: object
            properties:
              client_id:
                description: udid
                type: string
              device_name:
                type: string
        country_count:
          type: integer
        region_count:
          type: integer
        city_count:
          type: integer
        stable_count:
          type: integer
        strong_privacy_count:
          type: integer

    ProviderSpec:
      type: object
      properties:
        location_id:
          description: udid
          type: string
        location_group_id:
          description: udid
          type: string
        client_id:
          description: udid
          type: string
        best_available:
          type: boolean

    FindProviders2Args:
      type: object
      properties:
        # specs are unioned (or)
        specs:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSpec"
        count:
          type: integer
        force_count:
          type: boolean
        exclude_client_ids:
          type: array
          items:
            description: udid
            type: string
        exclude_destinations:
          type: array
          items:
            type: array
            items:
              description: udid
              type: string
        rank_mode:
          type: string
          enum: [quality, speed]
          default: quality
        force_minimum:
          type: boolean
        ip_family:
          description: |
            Filter providers by PROVEN address family. `""` and `v4-capable`
            take dualstack providers first, then v4-only; `v6-capable` takes
            dualstack first, then v6-only; `dualstack`, `v4-only` and
            `v6-only` are the exact categories.
          type: string
          enum: ["", v4-capable, v6-capable, dualstack, v4-only, v6-only]

    LocationCoordinates:
      description: |
        A wgs84 point. Zero is a valid coordinate — absence is expressed by
        omitting the containing object, never by (0, 0).
      type: object
      properties:
        lat:
          type: number
        lon:
          type: number

    ProviderLocation:
      description: |
        The location of a provider client, resolved from its active
        connection. Coordinate objects are omitted when unknown; region
        coordinates are the region centroid and city coordinates are the
        city centroid.
      type: object
      properties:
        country:
          type: string
        country_code:
          description: lowercase iso 3166-1 alpha-2
          type: string
        region:
          type: string
        city:
          type: string
        country_location_id:
          description: udid
          type: string
        region_location_id:
          description: udid
          type: string
        city_location_id:
          description: udid
          type: string
        region_coordinates:
          $ref: "#/components/schemas/LocationCoordinates"
        city_coordinates:
          $ref: "#/components/schemas/LocationCoordinates"

    FindProviders2Result:
      type: object
      properties:
        providers:
          type: array
          items:
            type: object
            properties:
              client_id:
                description: udid
                type: string
              estimated_bytes_per_second:
                type: integer
              has_estimated_bytes_per_second:
                type: boolean
              tier:
                type: integer
              intermediary_ids:
                type: array
                items:
                  description: udid
                  type: string
              network_only:
                description: The provider carries traffic only for its own network.
                type: boolean
              reputation_failed_names:
                description: |
                  The joined destination names the provider's exit address
                  failed the reputation class on. Reputation is not health --
                  nearly every honest hosted provider fails most of it.
                type: string
              ip_family:
                description: |
                  The provider's proven category: `dualstack`, `v4-only` or
                  `v6-only`. Absent for a fixed client-id spec, which bypasses
                  discovery.
                type: string
              location:
                # omitted when the provider's location is unknown
                $ref: "#/components/schemas/ProviderLocation"

    WalletBalanceResult:
      type: object
      properties:
        wallet_info:
          type: object
          properties:
            wallet_id:
              type: string
            token_id:
              type: string
            blockchain:
              type: string
            blockchain_symbol:
              type: string
            create_date:
              type: string
            balance_usdc_nano_cents:
              type: integer
            address:
              type: string

    WalletValidateAddressArgs:
      type: object
      properties:
        address:
          type: string
        chain:
          description: |
            Optional. The blockchain the address is on. For a Circle chain
            this is the Circle blockchain param (see
            https://developers.circle.com/w3s/reference/createvalidateaddress)
            and validation is Circle's; `TAO` is validated locally as a
            Bittensor ss58 address and is recorded for future use only, never
            as a payout destination.
          type: string

    WalletValidateAddressResult:
      type: object
      properties:
        valid:
          type: boolean

    WalletCircleInitResult:
      type: object
      properties:
        user_token:
          type: object
          properties:
            user_token:
              type: string
            encryption_key:
              type: string
        challenge_id:
          type: string
        error:
          type: object
          properties:
            message:
              type: string

    WalletCircleTransferOutArgs:
      type: object
      properties:
        to_address:
          type: string
        amount_usdc_nano_cents:
          type: integer
        terms:
          description: user consent to accept terms of transfer
          type: boolean

    WalletCircleTransferOutResult:
      type: object
      properties:
        user_token:
          type: object
          properties:
            user_token:
              type: string
            encryption_key:
              type: string
        challenge_id:
          type: string
        error:
          type: object
          properties:
            message:
              type: string

    SubscriptionBalanceResult:
      type: object
      properties:
        start_balance_byte_count:
          type: integer
          description: The initial data balance in bytes for the period.
        balance_byte_count:
          type: integer
          description: The current data balance in bytes.
        open_transfer_byte_count:
          type: integer
          description: Data tied up in pending contracts.
        current_subscription:
          description: |
            ONE of the active subscriptions, or absent. Shipped clients read
            this through the sdk and treat it as the plan indicator, so it
            keeps its single-value meaning and cannot name more than one
            store; use `subscriptions` for the full set.
          $ref: "#/components/schemas/Subscription"
        subscriptions:
          description: |
            EVERY store currently billing this network, one entry per store,
            so a caller can offer a cancel path for each -- a user subscribed
            on two stores is charged by both and has to cancel in both places.
            Not gated on Pro: an active renewal row means a store is taking
            money now, which is exactly when the cancel path must be
            reachable.
          type: array
          items:
            $ref: "#/components/schemas/Subscription"
        active_transfer_balances:
          type: array
          items:
            type: object
            properties:
              balance_id:
                description: udid
                type: string
              network_id:
                description: udid
                type: string
              start_time:
                type: string
              end_time:
                type: string
              start_balance_byte_count:
                type: integer
              net_revenue_nano_cents:
                type: integer
              subsidy_net_revenue_nano_cents:
                type: integer
              balance_byte_count:
                type: integer
              purchase_token:
                type: string
              paid:
                description: The balance carries revenue. Not the same as `pro` -- a data code is paid but data-only.
                type: boolean
              pro:
                description: |
                  The balance carries the Pro entitlement. A network is Pro
                  exactly when it has an in-window balance with this set.
                type: boolean
        pending_payout_usd_nano_cents:
          type: integer
        update_time:
          type: string
        price_tier:
          $ref: "#/components/schemas/PriceTier"
        onboarding_offer:
          description: The caller's welcome offer; null when none was issued.
          oneOf:
            - $ref: "#/components/schemas/OnboardingOffer"
            - type: "null"
        experiments:
          type: object
          description: |
            The caller's variant per experiment surface, keyed by surface
            (`offer.in_app`, `email.sequence`, `offer.intro_step`,
            `offer.final_screen`, `offer.email`, `offer.account`,
            `email.<step>`, `cadence`). Only running experiments appear. A
            network keeps its variant for the life of an experiment
            (hash(network_id, experiment_id), server-side). The variant
            `holdout` on `offer.in_app` means: show the regular plan picker,
            no offer screen, do not issue the offer in-app. Stamp the
            surface's experiment_id/variant on `offer.screen.shown`.
          additionalProperties:
            $ref: "#/components/schemas/ExperimentAssignment"

    Subscription:
      type: object
      properties:
        subscription_id:
          description: udid
          type: string
        store:
          type: string
        plan:
          type: string

    PriceTier:
      type: object
      description: |
        A regional price tier of Pro (config/all/pro.yml pro.price_tiers):
        `standard` ($40/year, $5/month) for the developed-country list,
        `regional` ($4/year, $0.50/month) everywhere else. Prices are USD;
        the store or Stripe shows the local-currency figure. The 14-day
        trial and the welcome offer apply on every tier.
      properties:
        name:
          type: string
          enum:
            - standard
            - regional
        yearly_usd:
          type: number
        monthly_usd:
          type: number
        currency:
          type: string
          description: always USD
        source:
          type: string
          description: how the country was resolved
          enum:
            - storefront
            - billing
            - ip
            - default
        estimate:
          type: boolean
          description: true when the tier is a display estimate (ip or default)

    OnboardingOffer:
      type: object
      description: |
        The welcome offer: `percent_off` (25) off the first year of Pro,
        `months_free` (3) in the store copy, valid until `expires_at`.
        `first_year_usd` / `regular_year_usd` are for the caller's current
        tier ($30 / $40 standard, $3 / $4 regional; the store products show
        $29.99 / $39.99). Redemption handles per store: the App Store offer
        code (`apple_offer_code`, one-time from the batch or the custom
        code), the Play offer tag (`play_offer_tag`, on the yearly base
        plan's discounted first-cycle offer) and the Stripe coupon
        (`stripe_coupon_id`, applied server-side by the checkout and the
        payment sheet); Solana quotes the offer price for plan
        `yearly_onboarding`. Every purchase path stamps `redeemed_at` and
        `store` on the first redemption.
      properties:
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        percent_off:
          type: integer
        months_free:
          type: integer
        first_year_usd:
          type: number
        regular_year_usd:
          type: number
        tier:
          type: string
        currency:
          type: string
        state:
          type: string
          enum:
            - active
            - redeemed
            - expired
        apple_offer_code:
          type: string
        play_offer_tag:
          type: string
        stripe_coupon_id:
          type: string
        redeemed_at:
          description: When the offer was first redeemed; null until then.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        store:
          description: The store of the first redemption; null until then.
          oneOf:
            - $ref: "#/components/schemas/EventStore"
            - type: "null"

    ExperimentAssignment:
      type: object
      description: The caller's variant on one experiment surface.
      properties:
        experiment_id:
          type: string
        variant:
          type: string
          description: a registry variant name; `holdout` means show nothing

    OnboardingOfferIssueArgs:
      type: object
      properties:
        surface:
          description: |
            Where the offer is being shown. Only these three are accepted
            here; empty means `intro_step`, and anything else (including
            `email_link`, which only the campaign engine issues) is refused
            with `error.message` "Unknown surface.".
          type: string
          enum:
            - ""
            - intro_step
            - final_screen
            - account
        storefront_country:
          type: string
          description: ISO 3166-1 storefront country, when the app knows it

    OfferSurface:
      type: string
      description: Where the offer is shown.
      enum:
        - intro_step
        - final_screen
        - email_link
        - account

    OfferDeclineControl:
      type: string
      enum:
        - free_plan_link
        - back
        - system_dismiss

    OfferPlan:
      type: string
      enum:
        - yearly
        - monthly

    EventStore:
      type: string
      enum:
        - apple
        - play
        - stripe
        - solana

    EventPlatform:
      type: string
      enum:
        - ios
        - macos
        - android
        - web
        - windows
        - linux

    PriceTierName:
      type: string
      enum:
        - standard
        - regional

    OnboardingOfferIssueResult:
      type: object
      properties:
        offer:
          description: The offer. The key is ABSENT (not null) when refused.
          $ref: "#/components/schemas/OnboardingOffer"
        created:
          type: boolean
          description: true for the call that issued the offer
        error:
          description: The key is ABSENT (not null) on success.
          $ref: "#/components/schemas/ErrorMessage"

    ErrorMessage:
      type: object
      properties:
        message:
          type: string

    ClientEvent:
      description: |
        One product event. The schema is CLOSED: `name` selects exactly one
        of the variants below and `props` may carry only that variant's
        keys (`additionalProperties: false`). A token is [A-Za-z0-9_.:+-],
        at most 64 characters. Server-written names (landing.clicked,
        app.opened, email.*, trial.*, refund, retention.*, connect.day) are
        refused from clients.
      oneOf:
        - $ref: "#/components/schemas/ClientEventOnboardingStepShown"
        - $ref: "#/components/schemas/ClientEventOnboardingStepCompleted"
        - $ref: "#/components/schemas/ClientEventOnboardingStepSkipped"
        - $ref: "#/components/schemas/ClientEventOfferScreenShown"
        - $ref: "#/components/schemas/ClientEventOfferCardTapped"
        - $ref: "#/components/schemas/ClientEventOfferCtaTapped"
        - $ref: "#/components/schemas/ClientEventOfferDeclined"
        - $ref: "#/components/schemas/ClientEventPurchaseStarted"
        - $ref: "#/components/schemas/ClientEventPurchaseCompleted"
        - $ref: "#/components/schemas/ClientEventPurchaseCancelled"
        - $ref: "#/components/schemas/ClientEventPurchaseFailed"
        - $ref: "#/components/schemas/ClientEventConnectFirst"
        - $ref: "#/components/schemas/ClientEventWidgetAdded"
        - $ref: "#/components/schemas/ClientEventFeedbackSubmitted"
        - $ref: "#/components/schemas/ClientEventSignupOptoutChanged"
      discriminator:
        propertyName: name
        mapping:
          onboarding.step.shown: "#/components/schemas/ClientEventOnboardingStepShown"
          onboarding.step.completed: "#/components/schemas/ClientEventOnboardingStepCompleted"
          onboarding.step.skipped: "#/components/schemas/ClientEventOnboardingStepSkipped"
          offer.screen.shown: "#/components/schemas/ClientEventOfferScreenShown"
          offer.card.tapped: "#/components/schemas/ClientEventOfferCardTapped"
          offer.cta.tapped: "#/components/schemas/ClientEventOfferCtaTapped"
          offer.declined: "#/components/schemas/ClientEventOfferDeclined"
          purchase.started: "#/components/schemas/ClientEventPurchaseStarted"
          purchase.completed: "#/components/schemas/ClientEventPurchaseCompleted"
          purchase.cancelled: "#/components/schemas/ClientEventPurchaseCancelled"
          purchase.failed: "#/components/schemas/ClientEventPurchaseFailed"
          connect.first: "#/components/schemas/ClientEventConnectFirst"
          widget.added: "#/components/schemas/ClientEventWidgetAdded"
          feedback.submitted: "#/components/schemas/ClientEventFeedbackSubmitted"
          signup.optout_changed: "#/components/schemas/ClientEventSignupOptoutChanged"

    ClientEventBase:
      type: object
      description: The fields every client event carries.
      required: [name, platform]
      properties:
        name:
          type: string
        at:
          type: string
          format: date-time
          description: |
            The client's event time (RFC 3339); missing = now. More than 5
            minutes in the future is reset to now (inside that grace window it
            is kept as sent), and more than 30 days in the past is clamped to
            30 days ago.
        platform:
          $ref: "#/components/schemas/EventPlatform"
        app_version:
          $ref: "#/components/schemas/EventToken"
        locale:
          type: string
          maxLength: 32
          pattern: "^[A-Za-z0-9_.:+-]{1,32}$"
          description: a locale token (e.g. pt-BR)
        session:
          $ref: "#/components/schemas/EventToken"
          description: an opaque per-app-session token
        props:
          type: object

    EventToken:
      type: string
      pattern: "^[A-Za-z0-9_.:+-]{1,64}$"

    CurrencyCode:
      type: string
      pattern: "^[A-Z]{3}$"
      description: |
        An ISO 4217 code. The server validates it only as a token of at most 3
        characters, so send the canonical uppercase form.

    ClientEventOnboardingStepShown:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: An onboarding step was shown, completed or skipped.
          properties:
            name:
              type: string
              const: onboarding.step.shown
            props:
              type: object
              additionalProperties: false
              required: [step]
              properties:
                step:
                  $ref: "#/components/schemas/EventToken"
                index:
                  type: integer
                elapsed_ms:
                  type: integer

    ClientEventOnboardingStepCompleted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: An onboarding step was shown, completed or skipped.
          properties:
            name:
              type: string
              const: onboarding.step.completed
            props:
              type: object
              additionalProperties: false
              required: [step]
              properties:
                step:
                  $ref: "#/components/schemas/EventToken"
                index:
                  type: integer
                elapsed_ms:
                  type: integer

    ClientEventOnboardingStepSkipped:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: An onboarding step was shown, completed or skipped.
          properties:
            name:
              type: string
              const: onboarding.step.skipped
            props:
              type: object
              additionalProperties: false
              required: [step]
              properties:
                step:
                  $ref: "#/components/schemas/EventToken"
                index:
                  type: integer
                elapsed_ms:
                  type: integer

    ClientEventOfferScreenShown:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The welcome offer was shown on a surface.
          properties:
            name:
              type: string
              const: offer.screen.shown
            props:
              type: object
              additionalProperties: false
              required: [surface]
              properties:
                surface:
                  $ref: "#/components/schemas/OfferSurface"
                experiment:
                  $ref: "#/components/schemas/EventToken"
                variant:
                  $ref: "#/components/schemas/EventToken"
                tier:
                  $ref: "#/components/schemas/PriceTierName"
                price_shown:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"
                expires_in_s:
                  type: integer

    ClientEventOfferCardTapped:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A plan card on the offer screen was tapped.
          properties:
            name:
              type: string
              const: offer.card.tapped
            props:
              type: object
              additionalProperties: false
              required: [plan]
              properties:
                plan:
                  $ref: "#/components/schemas/OfferPlan"

    ClientEventOfferCtaTapped:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The offer screen's primary button was tapped.
          properties:
            name:
              type: string
              const: offer.cta.tapped
            props:
              type: object
              additionalProperties: false
              required: [plan, store]
              properties:
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                store:
                  $ref: "#/components/schemas/EventStore"

    ClientEventOfferDeclined:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The offer screen was left without a purchase.
          properties:
            name:
              type: string
              const: offer.declined
            props:
              type: object
              additionalProperties: false
              required: [control]
              properties:
                control:
                  $ref: "#/components/schemas/OfferDeclineControl"
                elapsed_ms:
                  type: integer

    ClientEventPurchaseStarted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase started, completed or was cancelled.
          properties:
            name:
              type: string
              const: purchase.started
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"
                error_class:
                  $ref: "#/components/schemas/EventToken"

    ClientEventPurchaseCompleted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase started, completed or was cancelled.
          properties:
            name:
              type: string
              const: purchase.completed
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"
                error_class:
                  $ref: "#/components/schemas/EventToken"

    ClientEventPurchaseCancelled:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase started, completed or was cancelled.
          properties:
            name:
              type: string
              const: purchase.cancelled
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"
                error_class:
                  $ref: "#/components/schemas/EventToken"

    ClientEventPurchaseFailed:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A purchase failed.
          properties:
            name:
              type: string
              const: purchase.failed
            props:
              type: object
              additionalProperties: false
              required: [store]
              properties:
                store:
                  $ref: "#/components/schemas/EventStore"
                product:
                  $ref: "#/components/schemas/EventToken"
                plan:
                  $ref: "#/components/schemas/OfferPlan"
                trial:
                  type: boolean
                price:
                  type: number
                currency:
                  $ref: "#/components/schemas/CurrencyCode"
                error_class:
                  $ref: "#/components/schemas/EventToken"

    ClientEventConnectFirst:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: The network's first successful connection (once per network; resends are deduplicated).
          properties:
            name:
              type: string
              const: connect.first
            props:
              type: object
              additionalProperties: false
              properties: {}

    ClientEventWidgetAdded:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: A widget, tile or control was added.
          properties:
            name:
              type: string
              const: widget.added
            props:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/EventToken"

    ClientEventFeedbackSubmitted:
      allOf:
        - $ref: "#/components/schemas/ClientEventBase"
        - type: object
          description: In-app feedback was submitted.
          properties:
            name:
