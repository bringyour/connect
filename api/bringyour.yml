                $ref: "#/components/schemas/TransferStatsResult"

  /solana/payment-intent:
    post:
      tags: [subscription]
      summary: Create a Solana Pay intent for Pro
      description: |
        When paying for a subscription with Solana, we track the order through this intent.
      operationId: solanaPaymentIntent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolanaPaymentIntentArgs"
      responses:
        "200":
          description: The quoted intent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SolanaPaymentIntentResult"
        "401":
          description: Missing or invalid bearer token.

  /stripe/payment-intent:
    post:
      description: |
        When paying for a subscription with Stripe, create the payment intents,
        ephemeral key, and customer id needed to complete the purchase.
      operationId: Stripe Payment Intent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCreatePaymentIntentArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCreatePaymentIntentResult"

  /stripe/customer-portal:
    post:
      description: |
        Create a Stripe customer portal URL for the caller to manage their
        subscription.
      operationId: Stripe Customer Portal
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCreateCustomerPortalArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCreateCustomerPortalResult"

  /pay/data/checkout:
    post:
      description: |
        Buy a data pack with a card without signing in (the ur.io buy-data
        page). Starts a hosted Stripe checkout and returns the url to send the
        customer to. To pay with USDC on Solana use /pay/data/solana-intent.

        With `network_name`, the data is applied to that network by the payment
        webhook as soon as the payment confirms, and the customer is emailed a
        note that the data is on the network (the code is included, already
        applied). The name is matched case-insensitively and exactly; an unknown
        name returns `error.message` "No network named <name>".

        Without `network_name`, the customer receives a data code by email, as
        before. Stripe collects the email on its checkout page when `email` is
        not given.

        The success url is the configured checkout success url plus
        `item=<item_id>` and, when applying to a network, `network=<name>`.
        Unauthenticated, per-ip rate limited. Errors are returned as
        `error.message` with a 200.
      operationId: Pay Data Checkout
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataCheckoutArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataCheckoutResult"

  /pay/data/network-lookup:
    post:
      description: |
        Whether a network with exactly this name exists, for the buy-data page.
        Matched the same way /pay/data/checkout resolves `network_name`
        (case-insensitive, exact). Unlike /auth/network-check, which is a sign-up
        similarity check, a name within a few characters of an existing one is
        NOT reported as existing. Returns only the canonical name, no id.
        Unauthenticated, per-ip rate limited.
      operationId: Pay Data Network Lookup
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataNetworkLookupArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataNetworkLookupResult"

  /pay/data/solana-intent:
    post:
      description: |
        Buy a data pack with USDC on Solana, without signing in or giving an
        email: the data goes straight to the network named by `network_name`
        (matched like /pay/data/network-lookup). Records the payment intent and
        returns the exact `amount_usd` to send in USDC. The client generates
        `reference` (a Solana Pay reference: a fresh base58 public key) and
        either opens a Solana Pay url carrying it, or shows the buyer the
        receiving address, the amount and `memo` (which is the reference) to
        send by hand from any wallet or exchange. The Helius webhook
        (/pay/solana) matches the transfer by the reference among the
        transaction's account keys OR by the memo text, then lands the data on
        the network (data only, valid for one year, no Pro) and emails the
        network's admin when their login is an email.

        The intent expires after 24 hours (`expires_at`); a payment that arrives
        late still credits as long as the intent has not been swept. A reused
        reference, an unknown item or an unknown network return `error.message`
        with a 200. Unauthenticated, per-ip rate limited.
      operationId: Pay Data Solana Intent
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataSolanaIntentArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataSolanaIntentResult"

  /pay/data/solana-status:
    post:
      description: |
        The state of a data pack payment started with /pay/data/solana-intent,
        for the buy-data page to poll while it waits: `pending` until the USDC
        transfer is credited, `paid` once the data is on the network, `expired`
        when the intent passed `expires_at` unpaid, `unknown` for a reference
        that is not a data pack intent (plan intents made by a signed-in wallet
        are not reported here). Unauthenticated, per-ip rate limited.
      operationId: Pay Data Solana Status
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayDataSolanaStatusArgs"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayDataSolanaStatusResult"

  /stripe/create-checkout-session:
    post:
      description: |
        Create a Stripe Checkout Session for a subscription or data pack.

        `ui_mode` selects which shape the result carries -- a single Stripe
        session cannot produce both:
          - "hosted" (the default, so existing callers are unchanged): returns
            `checkout_url`, which the client opens in a browser.
          - "embedded": returns `client_secret` and `publishable_key`, which the
            client uses to mount Stripe Embedded Checkout inline (the desktop
            apps load ur.io/checkout in a webview with these).

        The subscription is granted by the `invoice.paid` webhook, never by the
        client; the client only polls /subscription/balance afterwards.
      operationId: Stripe Create Checkout Session
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeCreateCheckoutSessionArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeCreateCheckoutSessionResult"

  /verify:
    post:
      description: |
        One step of the validator's routing-verification protocol.
        The route accepts two body shapes:
        - SEED starts a new trail through the validator-chosen entry provider.
        - EXTEND claims the pending assigned hop of an active trail.
        The request must egress from the provider being claimed - the server
        resolves the hop from the request source IP, never from the body.
        Authentication is the protocol's own Ed25519 signatures (over the
        canonical binary messages, not the JSON), not a JWT.
        A non-final step returns the assign result (the server's signed
        commitment to the next hop); the final step returns status "complete"
        and the published proof.
      operationId: Verify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/VerifySeedArgs"
                - $ref: "#/components/schemas/VerifyExtendArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VerifyAssignResult"
                  - $ref: "#/components/schemas/VerifyFinalResult"
        "503":
          description: |
            The verification subsystem is not enabled on this deployment.
            `Retry-After: 3600`. The body is plain text, not JSON.

  /verify/keys:
    get:
      description: |
        The published server Ed25519 verify keys, by server_key_id.
        All historical keys are listed so old proofs remain verifiable
        across key rotations.
      operationId: Verify Keys
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyKeysResult"
        "503":
          description: |
            The verification subsystem is not enabled on this deployment.
            `Retry-After: 3600`. The body is plain text, not JSON.

  /verify/stats:
    get:
      tags: [subnet evidence]
      summary: Public per-provider verification statistics
      description: |
        The public reproducibility index of the routing-verification protocol:
        per provider and period, how many hops were assigned and how many were
        confirmed, the resulting reliability in parts per million, and the
        latency percentiles when they were measured. The answer names the
        profile and policy hash the rows were produced under, plus the egress
        hash key id (the id only -- the key itself never leaves the server), so
        a third party can check that two indexes are comparable.

        Unauthenticated, and it does not participate in validator scoring.
        `503` while the subnet subsystem is disabled.
      operationId: Verify Stats
      security: []
      parameters:
        - in: query
          name: from
          required: false
          description: RFC 3339 start of the window.
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          description: RFC 3339 end of the window.
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVerifyStatsResult"
        "400":
          description: A query parameter is not a valid RFC 3339 time or integer.
        "503":
          description: The verification subsystem is not enabled.

  /verify/proofs:
    get:
      tags: [subnet evidence]
      summary: Published trail proofs
      description: |
        The published completed trails, so anyone can re-verify them against
        the keys from `/verify/keys`. Same window parameters, profile and
        policy hash as `/verify/stats`. Unauthenticated; `503` while the
        subnet subsystem is disabled.
      operationId: Verify Proofs
      security: []
      parameters:
        - in: query
          name: from
          required: false
          description: RFC 3339 start of the window.
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: false
          description: RFC 3339 end of the window.
          schema:
            type: string
            format: date-time
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetVerifyProofsResult"
        "400":
          description: A query parameter is not a valid RFC 3339 time or integer.
        "503":
          description: The verification subsystem is not enabled.

  /sn/wallet:
    post:
      description: |
        Attach the caller's subnet coldkey - the ss58 address that pool payouts
        are claimable by. Proof of key possession is required: `message` is the
        single-use challenge issued by POST /auth/wallet-challenge for
        blockchain TAO and `signature` is the coldkey's sr25519 signature over
        it. `client_id` scopes the wallet to one provider client (a
        client-scoped JWT selects its own client). Banned addresses are
        rejected. Not retroactive: the wallet applies from the next committed
        epoch's leaf set. This wallet is deliberately separate from the
        account payout wallet.
      operationId: Sn Set Wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnSetWalletArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnSetWalletResult"
    get:
      description: |
        The coldkeys attached inside the caller's network: the network-level
        wallet (no `client_id`) and every provider client's wallet. `wallet` is
        the session's effective wallet (the client-scoped wallet for a client
        session when set, else the network wallet); absent when none is
        attached. An empty `wallets` list is not an error.
      operationId: Sn Get Wallet
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnGetWalletResult"

  /sn/wallet/validate:
    post:
      description: |
        Checks an address before it is attached: ss58 syntax with the Bittensor
        prefix, the operator ban list, and whether the account exists on the
        subtensor chain. When the chain cannot be reached the result reports
        `exists_on_chain: true` with a message, so an outage never blocks a
        user. No authentication; chain lookups are rate limited per source
        address.
      operationId: Sn Validate Wallet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnValidateWalletArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnValidateWalletResult"

  /sn/head:
    get:
      description: |
        The caller network's standing for a head mining spot (Top 200,
        WHITEPAPER 8.4). `score` is the server's estimate of split-adjusted
        distinct routable egress-IP breadth from the live trail egress index,
        `floor` the score of the last network inside `cutoff` (0 while fewer
        networks score), `rank_estimate` 1-based (0 without a score).
        `bound`/`hotkey`/`uid` reflect an active head binding. `source` is
        "server" until validators publish consensus scores on chain; a chain
        outage degrades to the estimate, never an error.
      operationId: Sn Head
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnHeadResult"

  /sn/head/binding:
    post:
      description: |
        Store a device's consent for a fleet binding (WHITEPAPER 11.4): the
        canonical binding payload and the client's Ed25519 signature over its
        keccak256 digest, optionally with the head hotkey's sr25519 signature.
        When both signatures verify the response carries the
        `bindFleetMember` calldata for the operator to submit from their own
        key. The server never submits on chain.
      operationId: Sn Head Binding
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnHeadBindingArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnHeadBindingResult"

  /sn/pool/claim:
    get:
      description: |
        The caller network's merkle pool-payout claim for an epoch:
        everything needed to call claim on the subnet contract.
        Claims are served once the epoch is finalized on chain.
      operationId: Sn Pool Claim
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: epoch
          schema:
            type: integer
          required: false
          description: |
            Epoch index. Absent means the latest finalized epoch -- and only
            absence defaults, since epoch 0 is a real epoch.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnPoolClaimResult"

  /sn/epoch:
    get:
      description: |
        The current subnet epoch index, boundaries, and deadlines mirrored
        from chain, so clients do not need their own RPC.
      operationId: Sn Epoch
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnEpochResult"

  # ----- subnet artifacts, evidence and client-key history -----

  /sn/artifact:
    get:
      tags: [subnet evidence]
      summary: One immutable payout artifact by content hash
      description: |
        Serve a canonical payout artifact addressed by its sha256 content
        hash. The hash is rechecked against the bytes before anything is
        returned, so a corrupt object store cannot silently substitute a
        different payout tree. Public and immutable: the answer carries the
        content hash as its `ETag` and a one-year immutable cache directive.
      operationId: Sn Artifact
      security: []
      parameters:
        - in: query
          name: hash
          required: true
          description: The artifact's sha256 content hash.
          schema:
            type: string
      responses:
        "200":
          description: The artifact document.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The hash is missing or not a canonical content key.
        "502":
          description: The artifact is unavailable or failed its integrity recheck.
        "503":
          description: The artifact store is unavailable.

  /sn/artifacts:
    get:
      tags: [subnet evidence]
      summary: Page the payout artifact history
      description: |
        List immutable payout artifact keys under a deployment and netuid
        prefix, optionally narrowed to one epoch and one operator id. Only
        public object identifiers are returned -- never signer or vault
        material. The page is validated as an integrity boundary before it is
        served: keys must be strictly increasing, inside the requested prefix,
        and named by a canonical lowercase 32-byte hex hash with a `.json`
        suffix.
      operationId: Sn Artifact History
      security: []
      parameters:
        - in: query
          name: deployment_id
          required: true
          description: One safe path segment (no `/`, `\` or `.`).
          schema:
            type: string
        - in: query
          name: netuid
          required: true
          description: A nonzero uint16.
          schema:
            type: integer
        - in: query
          name: epoch
          required: false
          description: A uint64. Required if `no_id` is given.
          schema:
            type: integer
        - in: query
          name: no_id
          required: false
          description: A nonzero uint64 operator id; only valid with `epoch`.
          schema:
            type: integer
        - in: query
          name: limit
          required: false
          description: Objects per page, default 256.
          schema:
            type: integer
        - in: query
          name: after
          required: false
          description: The previous page's `next_after`; must be inside the same prefix.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnArtifactHistoryResult"
        "400":
          description: A required selector is missing, or a selector or cursor is not usable.
        "502":
          description: The history could not be listed, or the page failed its integrity check.
        "503":
          description: The artifact store is unavailable, or does not support paging.

  /sn/attempt-artifact:
    get:
      tags: [subnet evidence]
      summary: Stream one typed attempt object
      description: |
        Stream the exact immutable bytes of one attempt object. `kind` selects
        the shape: `metadata` is a JSON document, `records` and `proofs` are
        newline-delimited JSON. `hash` is the canonical lowercase, nonzero,
        `0x`-prefixed sha256 of those bytes and is what the answer's `ETag`
        carries. Exactly these two query parameters are accepted, and a
        `Range` header is refused, so a partial read can never be mistaken for
        the whole object.

        Concurrency is bounded (16 readers, each with one fixed 32 KiB copy
        buffer) and a request that finds no slot is answered `429` with
        `Retry-After`. A stream that fails after any bytes have been written
        is aborted without a clean end-of-body rather than ending in a
        truncated object that looks complete.
      operationId: Sn Attempt Artifact
      security: []
      parameters:
        - in: query
          name: kind
          required: true
          schema:
            type: string
            enum: [metadata, records, proofs]
        - in: query
          name: hash
          required: true
          description: Canonical `0x`-prefixed lowercase sha256 of the object.
          schema:
            type: string
            pattern: "^0x[0-9a-f]{64}$"
      responses:
        "200":
          description: |
            The object's exact bytes. `metadata` is `application/json`;
            `records` and `proofs` are `application/x-ndjson`.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
            application/x-ndjson:
              schema:
                type: string
        "400":
          description: The query is not exactly `kind` and `hash`, the identity is not canonical, or a `Range` header was sent.
        "408":
          description: The request was cancelled.
        "429":
          description: Every reader slot is busy.
        "502":
          description: The object is unavailable or failed integrity.
        "503":
          description: The artifact reader or store is unavailable.
    post:
      tags: [subnet evidence]
      summary: Stage one typed attempt object
      description: |
        Upload the exact bytes of one attempt object. Requires a CLIENT jwt.
        The identity is the same `kind` and `hash` pair the reader uses, and
        the server recomputes the sha256 of the body and refuses anything that
        differs, so an upload can only ever publish the object it names.

        The framing is strict: exactly one `Content-Type` matching the kind
        (`application/json` for `metadata`, `application/x-ndjson` for
        `records` and `proofs`), a positive `Content-Length` within the
        object bound (32 MiB for `records` and `proofs`, 2 MiB for
        `metadata`), and no `Content-Encoding`, `Content-Range`, `Range`,
        transfer encoding or trailers -- a transformed or partial upload is
        forbidden. Size is charged against the account's byte budget BEFORE
        any storage work, and the active upload slots are bounded.

        A validator may instead present a signed reserved-upload intent in
        `X-Urnetwork-Validator-Upload`, which admits the upload against the
        api's own reserved lifecycle. The reserved header never bypasses
        client authentication.

        The answer is `204` with the content hash in `ETag`.
      operationId: Sn Upload Attempt Artifact
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: kind
          required: true
          schema:
            type: string
            enum: [metadata, records, proofs]
        - in: query
          name: hash
          required: true
          description: Canonical `0x`-prefixed lowercase sha256 of the body.
          schema:
            type: string
            pattern: "^0x[0-9a-f]{64}$"
        - in: header
          name: X-Urnetwork-Validator-Upload
          required: false
          description: A signed validator reserved-upload intent.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
          application/x-ndjson:
            schema:
              type: string
      responses:
        "204":
          description: Published. The content hash is in `ETag`.
          headers:
            ETag:
              schema:
                type: string
        "400":
          description: The identity is not canonical, the framing is transformed or partial, or the body does not hash to `hash`.
        "401":
          description: Missing or invalid client bearer token.
        "403":
          description: The reserved upload intent is unavailable or ambiguous.
        "408":
          description: The upload was cancelled.
        "413":
          description: No positive bounded `Content-Length`, or the body is over the object bound.
        "429":
          description: Every upload slot is busy, or the account byte budget is exhausted.
        "502":
          description: The immutable write or its readback failed.
        "503":
          description: The attempt store is unavailable.

  /sn/evidence:
    get:
      tags: [subnet evidence]
      summary: One signed release-evidence envelope
      description: |
        Serve a signed release-evidence envelope by its content hash. The
        envelope's signature is re-verified and its content hash re-checked
        against the requested one before the bytes are returned. Public and
        immutable, with the content hash as `ETag`.
      operationId: Sn Evidence
      security: []
      parameters:
        - in: query
          name: hash
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnEvidenceEnvelope"
        "400":
          description: The hash is missing or not a canonical content key.
        "404":
          description: No evidence with that hash.
        "502":
          description: The evidence could not be read, or failed its signature or hash check.
        "503":
          description: The artifact store is unavailable.
    post:
      tags: [subnet evidence]
      summary: Publish a signed release-evidence envelope
      description: |
        Publish a release-evidence envelope. There is no header credential:
        the authorization IS the envelope's own signature, which must verify
        and must be the operator's configured artifact key, and whose chain
        id, netuid, deployment id and genesis hash must all match this
        operator. The body is capped at 64 MiB. Every rejection is the same
        `400`, so a caller cannot probe which check failed.
      operationId: Sn Publish Evidence
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnEvidenceEnvelope"
      responses:
        "200":
          description: Published; the content and history keys it was published at.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnPublishedEvidenceResult"
        "400":
          description: The body is empty, over the limit, or the envelope was rejected.

  /sn/evidence/history:
    get:
      tags: [subnet evidence]
      summary: Page one run's evidence history
      description: |
        List the evidence objects of ONE signed run. Both `kind` and `run_id`
        are mandatory, so a public caller cannot enumerate other campaigns or
        turn a small verifier query into an unbounded deployment scan.

        With `hash` the answer is that one object, fully re-verified
        (signature, deployment, netuid, kind, run and content hash) rather
        than merely listed, and `after` may not be combined with it. The
        legacy empty-run namespace is readable only by exact hash.
      operationId: Sn Evidence History
      security: []
      parameters:
        - in: query
          name: deployment_id
          required: true
          schema:
            type: string
        - in: query
          name: netuid
          required: true
          description: A nonzero uint16.
          schema:
            type: integer
        - in: query
          name: kind
          required: true
          schema:
            type: string
        - in: query
          name: run_id
          required: true
          schema:
            type: string
        - in: query
          name: hash
          required: false
          description: Read exactly this object instead of paging.
          schema:
            type: string
        - in: query
          name: limit
          required: false
          description: Objects per page, default 256.
          schema:
            type: integer
        - in: query
          name: after
          required: false
          description: The previous page's `next_after`. Not valid with `hash`.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnEvidenceHistoryResult"
        "400":
          description: A required selector is missing or unusable, or `after` was combined with `hash`.
        "404":
          description: No such evidence history object.
        "502":
          description: The history could not be listed, or an object failed integrity.
        "503":
          description: The artifact store is unavailable, or does not support paging.

  /sn/client-key/observation:
    post:
      tags: [subnet evidence]
      summary: Publish one client-key observation
      description: |
        Publish one signed client-key observation and read back that client's
        key history. A key observation creates a durable signed public
        statement, so it is an explicit POST owned by an authenticated CLIENT
        session rather than a side effect of the public `GET /key/{clientId}`
        lookup, and the request cannot supply a key to sign.

        The framing is strict: `Content-Type: application/json`, a positive
        `Content-Length` of at most 16 KiB, no content encoding, transfer
        encoding or trailers. The body must be exactly the canonical encoding
        of the request -- unknown fields, trailing JSON and any non-canonical
        re-encoding are refused -- and the full maximum response size is
        charged against the account's byte budget before any operator
        signature or public write, so a failed call still pays its admission.
      operationId: Sn Client Key Observation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnClientKeyObservationArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyHistoryResponse"
        "400":
          description: The framing is invalid, or the body is non-canonical or carries trailing JSON.
        "401":
          description: Missing or invalid client bearer token.
        "429":
          description: Every observation slot is busy, or the account byte budget is exhausted.

  /sn/client-key/observations:
    post:
      tags: [subnet evidence]
      summary: Publish a batch of client-key observations
      description: |
        The plural form of `/sn/client-key/observation`, with the same
        authenticated, bounded and charged publication contract: one HTTP body
        never becomes one logical quota item, so the maximum response size is
        charged once PER request in the batch before any work is done. The
        body is capped at 1 MiB and the responses come back in request order,
        each an encoded client-key history response.

        A batch whose chain work cannot be admitted is refused with `413` and
        an `X-Ur-Client-Key-Batch-Admission: work` header.
      operationId: Sn Client Key Observations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientKeyObservationBatchRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientKeyObservationBatchResponse"
        "400":
          description: The framing is invalid or the batch request could not be decoded.
        "401":
          description: Missing or invalid client bearer token.
        "405":
          description: Not a `POST`.
        "408":
          description: The request was cancelled.
        "413":
          description: The batch's chain work was refused; see `X-Ur-Client-Key-Batch-Admission`.
        "429":
          description: Every observation slot is busy, or the account byte budget is exhausted.

  # ----- onboarding program (mmm/onboarding/PLAN.md) -----

  /onboarding/offer/issue:
    post:
      tags: [onboarding]
      summary: Issue the welcome offer
      description: |
        Issue the caller's welcome offer: 25% off the first year of Pro (3
        months free), valid `validity_days` (5) from issue, stacked on the
        14-day trial, redeemable on every store. Issued ONCE per network:
        the call is idempotent and returns the existing offer in whatever
        state it is in (`created: false`); an expired offer is never
        re-issued. Call it the moment the offer surface renders (the intro
        plan step), so the deadline is real.

        Refused with `error` when the onboarding config is absent, or when
        the caller is in the `holdout` variant of the in-app offer
        experiment (`experiments["offer.in_app"]`): those networks show the
        regular plan picker and reach the offer by email instead.

        Budgeted per caller address (30 per 10 minutes): over budget the
        response is 429 with a Retry-After header.
      operationId: onboardingOfferIssue
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingOfferIssueArgs"
            examples:
              introStep:
                summary: The intro plan step renders
                value:
                  surface: intro_step
                  storefront_country: US
      responses:
        "200":
          description: The caller's offer, created now or already issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingOfferIssueResult"
              examples:
                created:
                  summary: Issued by this call
                  value:
                    created: true
                    offer:
                      issued_at: "2026-09-09T16:00:00Z"
                      expires_at: "2026-09-14T16:00:00Z"
                      percent_off: 25
                      months_free: 3
                      first_year_usd: 30
                      regular_year_usd: 40
                      tier: standard
                      currency: USD
                      state: active
                      apple_offer_code: ONBOARD25
                      play_offer_tag: onboarding25
                      stripe_coupon_id: onboarding25
                      redeemed_at: null
                      store: null
                holdout:
                  summary: Refused for the in-app holdout
                  value:
                    created: false
                    error:
                      message: holdout
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: |
            Too many requests from this address. The body is PLAIN TEXT, not JSON: every non-2xx in this api is
            written by the shared error path, which sends the message as
            `text/plain`. Read `Retry-After` for the wait.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string

  /client/events:
    post:
      tags: [analytics]
      summary: Store a batch of product events
      description: |
        Store a batch of product events (at most 200 per call) against the
        CLOSED event schema (see ClientEvent). The network id comes from the
        bearer token only; `tier`, path, experiment and variant are stamped by
        the server. `platform` is required and must be one of the known
        platforms: an event without one is rejected. Unknown event names, unknown prop keys,
        missing required props and ill-typed values are refused PER EVENT in
        `rejected` (the rest of the batch is stored); a rejection is final,
        the client must not resend that event. No free text is stored except
        `feedback.submitted.text`, which is redacted (emails, phone numbers,
        IP addresses) before storage.

        Clients batch every 30 s or on background, drop an event after three
        failed calls, and never send more than 200 per call (a larger batch
        is a 400). Budgeted per caller address (120 calls per 10 minutes):
        over budget the response is 429 with a Retry-After header.
      operationId: clientEventsSend
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientEventsSendArgs"
            examples:
              batch:
                summary: An offer exposure and a purchase start
                value:
                  events:
                    - name: offer.screen.shown
                      at: "2026-09-09T16:00:03Z"
                      platform: android
                      app_version: 2026.9.9
                      locale: en-US
                      session: 3f9c1a
                      props:
                        surface: intro_step
                        experiment: offer_screen
                        variant: control
                        tier: standard
                        price_shown: 29.99
                        currency: USD
                        expires_in_s: 431997
                    - name: purchase.started
                      at: "2026-09-09T16:00:41Z"
                      platform: android
                      app_version: 2026.9.9
                      locale: en-US
                      session: 3f9c1a
                      props:
                        store: play
                        product: supporter-yearly
                        plan: yearly
                        trial: true
                        price: 29.99
                        currency: USD
      responses:
        "200":
          description: Per-event acceptance for the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEventsSendResult"
              examples:
                partial:
                  summary: One event refused
                  value:
                    accepted: 1
                    rejected:
                      - index: 1
                        message: "props.plan: unknown value"
        "400":
          description: More than 200 events in the batch, or a malformed body.
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: |
            Too many event calls from this address. The body is PLAIN TEXT, not JSON: every non-2xx in this api is
            written by the shared error path, which sends the message as
            `text/plain`. Read `Retry-After` for the wait.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string

  /onboarding/click:
    post:
      tags: [onboarding, analytics]
      summary: Record a campaign landing click
      description: |
        Record a campaign landing-page click. Every onboarding email link is
        `https://ur.io/o/<step>?t=<token>`; the landing page posts the token
        here, which writes the server-side `landing.clicked` attribution
        event and answers with the in-app destination to route to
        (`onboarding/connect`, `onboarding/widgets`, `onboarding/offer`,
        `onboarding/feedback`). An app open (`/network/auth-client`) within
        48 h of the click is attributed to it as `app.opened`.

        No authentication: the signed token is the credential, and the
        response carries nothing about the network. An expired token still
        returns `step` and `destination` (with `ok: false`,
        `error: expired`) so the page can route without attributing; an
        invalid token returns `ok: false`, `error: invalid`. Budgeted per
        caller address (60 per 10 minutes) -> 429 with Retry-After.
      operationId: onboardingClick
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingClickArgs"
            examples:
              click:
                value:
                  token: eyJzIjoiZTFfY29ubmVjdCIsIm4iOi4uLn0.sig
      responses:
        "200":
          description: The step the link belongs to and where to route.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingClickResult"
              examples:
                attributed:
                  value:
                    ok: true
                    step: e1_connect
                    destination: onboarding/connect
                expired:
                  value:
                    ok: false
                    step: e1_connect
                    destination: onboarding/connect
                    error: expired
        "429":
          description: |
            Too many requests from this address. The body is PLAIN TEXT, not JSON: every non-2xx in this api is
            written by the shared error path, which sends the message as
            `text/plain`. Read `Retry-After` for the wait.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string

  /onboarding/feedback/{token}:
    get:
      tags: [onboarding]
      summary: Resolve a feedback link token
      description: |
        Resolve a feedback link token (`https://ur.io/f/<token>?r=n` or
        `?why=n`) to the rating or reason the one-tap email button stood
        for, so the in-app feedback screen opens pre-filled. The token
        carries the step and may carry the rating/reason; `r` (1-5) and
        `why` (a reason token) override when present. The app then submits
        the actual feedback through `/feedback/send-feedback` and reports
        `feedback.submitted` through `/client/events`.

        No authentication: the signed token is the credential. Budgeted per
        caller address (60 per 10 minutes) -> 429 with Retry-After.
      operationId: onboardingFeedbackToken
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The signed feedback token from the email link.
          schema:
            type: string
        - name: r
          in: query
          required: false
          description: Rating 1-5 from the tapped button.
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: why
          in: query
          required: false
          description: Reason token from the tapped button.
          schema:
            type: string
      responses:
        "200":
          description: The pre-fill for the feedback screen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingFeedbackTokenResult"
              examples:
                rating:
                  value:
                    ok: true
                    step: e4_feedback
                    rating: 4
                    reason: ""
                reason:
                  value:
                    ok: true
                    step: e4_feedback
                    reason: did_not_work
        "429":
          description: |
            Too many requests from this address. The body is PLAIN TEXT, not JSON: every non-2xx in this api is
            written by the shared error path, which sends the message as
            `text/plain`. Read `Retry-After` for the wait.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string

  /subscription/stripe/payment-sheet:
    post:
      tags: [subscription, onboarding]
      summary: Prepare an inline Stripe payment sheet
      description: |
        Prepare an inline Stripe PaymentSheet purchase of Pro (the non-Play
        Android flavors, Windows and Linux; never the play flavor or
        iOS/macOS). The server creates or reuses the Stripe customer
        (metadata `network_id`) and the subscription at the caller's
        regional tier price: the yearly plan with the 14-day trial and, when
        the caller's welcome offer is redeemable, the 25% coupon applied
        server-side; the monthly plan without a trial. The sheet confirms
        the returned intent: a SetupIntent for the yearly plan
        (`intent_type: setup`, `setup_intent_client_secret`) or the first
        invoice's PaymentIntent for the monthly plan (`intent_type: payment`,
        `payment_intent_client_secret`). Configure the sheet with
        `customer_id`, `ephemeral_key_secret` and `publishable_key`; pass the
        Stripe API version the mobile SDK requires as `stripe_version`.

        The trial is credited only once the card is attached
        (`setup_intent.succeeded`); an abandoned sheet leaves nothing behind.
        The charged tier is finalized from the card's billing country before
        the trial ends and the tier is recorded on the subscription.
        Calling again replaces a pending, unfinished sheet.
      operationId: stripePaymentSheet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripePaymentSheetArgs"
            examples:
              yearly:
                value:
                  plan: yearly
                  stripe_version: "2024-06-20"
      responses:
        "200":
          description: The intent, customer and key material for the sheet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripePaymentSheetResult"
              examples:
                yearlyWithOffer:
                  value:
                    customer_id: cus_123
                    ephemeral_key_secret: ek_test_123
                    setup_intent_client_secret: seti_123_secret_456
                    intent_type: setup
                    subscription_id: sub_123
                    publishable_key: pk_test_123
                    tier: standard
                    currency: USD
                    plan: yearly
                    amount_first_period_usd: 30
                    regular_period_usd: 40
                    trial_days: 14
                    trial_end_at: "2026-09-23T16:00:00Z"
                    offer_applied: true
                    error: null
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: |
            Too many requests from this address. The body is PLAIN TEXT, not JSON: every non-2xx in this api is
            written by the shared error path, which sends the message as
            `text/plain`. Read `Retry-After` for the wait.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string

  /subscription/stripe/prices:
    get:
      tags: [subscription, onboarding]
      summary: Stripe prices for the caller's tier
      description: |
        The Stripe price ids (and USD amounts) of the caller's regional tier,
        the publishable key, and the welcome-offer coupon id when the
        caller's offer is redeemable -- for clients that build their own
        Stripe flow (the Windows/Linux Payment Element).
      operationId: stripePrices
      security:
        - BearerAuth: []
      parameters:
        - name: storefront_country
          in: query
          required: false
          description: ISO 3166-1 alpha-2 storefront country, when the app knows it.
          schema:
            type: string
      responses:
        "200":
          description: The tier's price ids and key material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripePricesResult"
              examples:
                standard:
                  value:
                    tier: standard
                    currency: USD
                    yearly_price_id: price_yearly_standard
                    monthly_price_id: price_monthly_standard
                    yearly_usd: 40
                    monthly_usd: 5
                    publishable_key: pk_test_123
                    onboarding_coupon_id: onboarding25
                    offer_eligible: true
                    error: null
        "401":
          description: Missing or invalid bearer token.

  # ----- optimization loop results (mmm/onboarding/PLAN.md, implemented by S3) -----

  /admin/onboarding/results:
    get:
      tags: [analytics]
      summary: Aggregated onboarding experiment results
      description: |
        The nightly aggregate the analysis script (mmm/onboarding/analyze.mjs)
        reads: `onboarding_results_daily`, recomputed at 02:00 UTC by the
        `OnboardingResultsRollup` task for the last `onboarding.results.rollup_days`
        cohort days (config/main/onboarding.yml). One row per cohort day
        (the network's sign-up day, UTC), experiment, variant, surface,
        platform, price tier and path. Counts are networks, never events.

        Exposure is the registry assignment (hash of network id and
        experiment id), so holdout rows exist without any stamped event; for
        the email sequence it is the variant the campaign row was served, and
        only networks with an email address are exposed to an email
        experiment. The pseudo-experiment `_all` (variant `all`, surface
        `all`) counts every network of the cohort so the funnel per platform,
        tier and path is readable without an experiment. The cohort is the
        campaign's real population: a network enters (its cohort time is the
        enrollment time) when its login is an email address, otherwise on
        its first device client within 30 days of creation; a network with
        neither an email login nor a device is never a cohort member.

        Column definitions, measured from each network's cohort time:
        `sent`, `delivered`, `opened`, `clicked`, `unsubscribe`, `complaint` =
        at least one `email.*` event of that name, any step;
        `landing_clicked` = a `landing.clicked`; `app_open_48h` = an
        `app.opened` (the auth-client attribution within 48 h of a landing
        click); `connect_7d` = a `connect.day` (server-written on each UTC day the
        network had a connection) or a `connect.first` within 7 days; `widget_7d` = `widget.added` within 7 days; `feedback_7d` =
        `feedback.submitted` or an account feedback within 7 days;
        `pro_start_14d` = a `purchase.completed` or the first subscription
        renewal (trial included) within 14 days; `trial_to_paid_35d` =
        `trial.converted` within 35 days; `refund_60d` = a `refund` within
        60 days; `retention_d7` = a `connect.day` on day 6 or 7;
        `retention_d30` = a `connect.day` on day 28, 29 or 30. Connection
        days are the analytics events, never the connection table (which
        is pruned hours after disconnect), so they exist from the day the
        server started writing `connect.day`. A window that has
        not matured reports 0: read `matured_days` (the cohort's age at
        `computed_at`) to tell "not yet" from "did not".

        Volume floor: rows with fewer than `onboarding.results.min_exposures`
        exposures (default 10) are suppressed, and no identifier of any kind
        is returned. Ordered by the dimension tuple; keyset paged by
        `cursor`.

        Auth: `Authorization: Bearer <token>` where the token is listed in
        vault `onboarding.yml` under `onboarding.admin_bearers` (compared in
        constant time). A missing or unknown token is 401; a network JWT is
        403. Without the vault entry the endpoint is closed.
      operationId: adminOnboardingResults
      security:
        - AdminBearerAuth: []
      parameters:
        - name: experiment
          in: query
          required: true
          description: The experiment id from the registry.
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: First cohort day, inclusive (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last cohort day, inclusive (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: surface
          in: query
          required: false
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventPlatform"
        - name: tier
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PriceTierName"
        - name: path
          in: query
          required: false
          description: The campaign path, A (saw the in-app offer) or B.
          schema:
            type: string
            enum: [A, B]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Rows per page, 1-1000 (default 500).
          schema:
            type: integer
      responses:
        "200":
          description: A page of aggregated rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingResultsPage"
              examples:
                page:
                  value:
                    rows:
                      - cohort_day: "2026-09-15"
                        experiment: e1_subject_2026w38
                        variant: control
                        surface: email.e1
                        platform: android
                        tier: standard
                        path: A
                        exposures: 412
                        sent: 412
                        delivered: 401
                        opened: 190
                        clicked: 31
                        landing_clicked: 31
                        app_open_48h: 24
                        connect_7d: 19
                        widget_7d: 6
                        feedback_7d: 9
                        pro_start_14d: 5
                        trial_to_paid_35d: 3
                        refund_60d: 0
                        retention_d7: 41
                        retention_d30: 22
                        unsubscribe: 1
                        complaint: 0
                        matured_days: 61
                        computed_at: "2026-11-16T02:00:12Z"
                    next_cursor: null
                    min_exposures: 10
        "400":
          description: Missing experiment, a date not YYYY-MM-DD, `to` before `from`, or an invalid cursor.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The token is a network token, not an admin bearer.

  /admin/onboarding/email-tracker:
    get:
      tags: [analytics]
      summary: Per-flow-step email send and engagement aggregate
      description: |
        The durable per-flow-step send and engagement aggregate of the
        onboarding email campaign, one row per send day and dimension tuple
        (step, template, variant, experiment, experiment variant, platform,
        path). Counts are DISTINCT NETWORKS, never events, and no network,
        address, message or session identifier is ever returned; rows below
        the configured minimum-exposure floor (`min_networks`) are suppressed.

        `engaged` is the union of `email.clicked`, `landing.clicked`,
        `app.opened`, `connected`, `widget.added`, `feedback.submitted` and
        `pro.started`, deliberately excluding `email.opened` (open tracking is
        too unreliable to count as engagement). `attribution_ambiguous` counts
        events that could only be attributed to a template shared by more than
        one flow step. The `definitions` block returns these rules with the
        data, so a reader never has to assume them.

        Same auth as `/admin/onboarding/results`: an admin bearer from vault
        `onboarding.yml`, compared in constant time. Keyset paged by `cursor`.
      operationId: adminOnboardingEmailTracker
      security:
        - AdminBearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: First send day, inclusive (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Last send day, inclusive (YYYY-MM-DD). Must not precede `from`, and the range is bounded.
          schema:
            type: string
            format: date
        - name: step
          in: query
          required: false
          description: A flow step; e1, e2, e3, e4 or e5.
          schema:
            type: string
        - name: experiment
          in: query
          required: false
          schema:
            type: string
        - name: platform
          in: query
          required: false
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: The campaign path, A or B.
          schema:
            type: string
            enum: [A, B]
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: A page of aggregated rows with the definitions they were computed under.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingEmailTrackerPage"
        "400":
          description: A date is not YYYY-MM-DD, `to` precedes `from`, the range is too long, or a step, path or cursor is invalid.
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The token is a network token, not an admin bearer.

  /admin/onboarding/experiments:
    get:
      tags: [analytics]
      summary: The experiment registry as loaded
      description: |
        The onboarding experiment registry (config/main/onboarding.yml
        `onboarding.experiments`) as the server loaded it, so the analysis
        script judges results against the same allocation, primary metric,
        guardrails and minimum exposures the server applied, plus each
        experiment's live variant states from the pause overlay
        (`network_onboarding_experiment_state`: a variant the nightly
        guardrail check or `bringyourctl onboarding experiments --pause`
        paused is served as `control` until resumed) and the results
        configuration (`min_exposures`, `rollup_days`, `guardrail_days`).
        Same auth as /admin/onboarding/results.
      operationId: adminOnboardingExperiments
      security:
        - AdminBearerAuth: []
      responses:
        "200":
          description: The loaded registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingExperimentsResult"
              examples:
                registry:
                  value:
                    experiments:
                      - id: offer_screen
                        surface: offer.in_app
                        status: running
                        start: "2026-09-15"
                        stop: "2026-10-27"
                        allocation:
                          control: 80
                          holdout: 20
                        variants:
                          control: {}
                          holdout: {}
                        primary_metric: pro_start_14d
                        secondary: [trial_to_paid_35d, refund_rate]
                        guardrails:
                          refund_rate: 0.06
                        min_exposures: 3000
        "401":
          description: Missing or invalid bearer token.
        "403":
          description: The token is not an admin token.

  /updates/brevo:
    post:
      tags: [analytics]
      summary: Brevo transactional webhook
      description: |
        The Brevo transactional-email webhook. Brevo is registered
        (idempotently, by the server when `onboarding.enabled` is on) to post
        one event per delivery step.

        Authentication is HTTP BASIC, not bearer and not a network token: the
        request must carry `Authorization: Basic base64(<secret>:)` where
        `<secret>` is one of the account's `webhook_bearers` (vault
        `brevo.yml`) and the password half is empty.

        `unsubscribe` turns the account's product-updates preference off (the
        existing behavior). For the onboarding campaign the remaining events
        are recorded as server-written
        `email.delivered|opened|clicked|bounced|complained|unsubscribed`
        events against the network, with the campaign step taken from the
        stored send that `message-id` names. An event whose message id is not
        a known campaign send records nothing.

        The event name is matched lower-cased against this exact set:
        `delivered`; `opened`, `unique_opened`, `proxy_open`; `click`,
        `clicked`; `hard_bounce`, `blocked`, `invalid_email`, `error`;
        `spam`, `complaint`; `unsubscribed`, `unsubscribe`. Anything else
        records no campaign event. A hard bounce or a complaint exits the
        network from the sequence.
      operationId: brevoWebhook
      security:
        - BrevoWebhookAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrevoWebhookArgs"
            examples:
              click:
                value:
                  event: click
                  email: person@example.com
                  message-id: "<202609091600.123@smtp-relay.mailin.fr>"
                  tags: [onboarding, e1_connect, control]
                  link: https://ur.io/o/e1_connect?t=...
                  ts_event: 1757495521
      responses:
        "200":
          description: Acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrevoWebhookResult"
        "401":
          description: The credential is not one of the account's webhook bearers.

  # ----- oauth authorization server (server/IDP.md) -----

  /.well-known/oauth-authorization-server:
    get:
      tags: [oauth]
      summary: Authorization server metadata
      description: |
        The rfc 8414 authorization server metadata. Served with
        `Cache-Control: no-store`, and identical to the OpenID Connect
        discovery document below. The `issuer` it publishes is the hostname
        clients must use, which is not necessarily the api host this request
        reached.
      operationId: Oauth Server Metadata
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"

  /.well-known/openid-configuration:
    get:
      tags: [oauth]
      summary: OpenID Connect discovery
      description: |
        The OpenID Connect discovery document. The same document as
        `/.well-known/oauth-authorization-server`.
      operationId: Oauth Openid Configuration
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationServerMetadata"

  /.well-known/jwks.json:
    get:
      tags: [oauth]
      summary: The signing keys
      description: |
        The authorization server's public signing keys as a JWK set. All
        current keys are listed so tokens stay verifiable across a rotation.
      operationId: Oauth Jwks
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwkSet"

  /oauth/token:
    post:
      tags: [oauth]
      summary: Exchange a code or refresh token
      description: |
        The rfc 6749 token endpoint, as a form post. Two grants are supported:
        `authorization_code` (with the PKCE `code_verifier`, and optionally the
        rfc 8707 `resource` indicator) and `refresh_token`. Clients are public
        -- the token endpoint auth method is `none` -- so `client_id` is
        always required and there is no client secret.

        Errors are the rfc 6749 section 5.2 envelope. The descriptions are
        deliberately terse and the detail is logged rather than returned, so
        an error cannot be used to probe which check failed. The response is
        never cached by a shared cache.
      operationId: Oauth Token
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id, grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code, refresh_token]
                client_id:
                  type: string
                code:
                  type: string
                  description: authorization_code grant.
                redirect_uri:
                  type: string
                  description: authorization_code grant; must be registered for this client.
                code_verifier:
                  type: string
                  description: authorization_code grant; the PKCE verifier.
                resource:
                  type: string
                  description: authorization_code grant; the rfc 8707 resource indicator.
                refresh_token:
                  type: string
                  description: refresh_token grant.
                scope:
                  type: string
                  description: refresh_token grant; a space-separated subset of the granted scopes.
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthTokenResponse"
        "400":
          description: invalid_request, invalid_client, invalid_grant, or unsupported_grant_type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"
        "403":
          description: access_denied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"
        "500":
          description: server_error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"

  /oauth/register:
    post:
      tags: [oauth]
      summary: Dynamic client registration
      description: |
        Dynamic client registration (rfc 7591). Deprecated by the MCP
        specification in favor of client id metadata documents, and kept for
        clients that predate it. The endpoint is openly writable, so it is
        metered per caller address before the body is parsed or anything is
        stored; over budget it answers `429` with `Retry-After`. Registered
        clients are public, so no secret is issued.
      operationId: Oauth Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthClientMetadata"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthRegisteredClient"
        "400":
          description: invalid_client_metadata -- the metadata could not be parsed or was rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"
        "429":
          description: temporarily_unavailable -- too many registrations from this address.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"

  /oauth/revoke:
    post:
      tags: [oauth]
      summary: Revoke a refresh token
      description: |
        Token revocation (rfc 7009), as a form post. Always answers `200` with
        an empty body: per the rfc a client must not be able to tell an
        unknown token from a revoked one.
      operationId: Oauth Revoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        "200":
          description: Acknowledged, whether or not the token existed.
        "400":
          description: invalid_request -- the form could not be parsed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"

  /oauth/userinfo:
    get:
      tags: [oauth]
      summary: OpenID Connect userinfo
      description: |
        The OpenID Connect userinfo endpoint. Authenticated by an ACCESS TOKEN
        this authorization server issued, carrying the `openid` scope -- not by
        a URnetwork network JWT. The token's audience is the resource it was
        minted for rather than this issuer, so the audience is deliberately
        not constrained here.
      operationId: Oauth Userinfo
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthUserInfo"
        "401":
          description: invalid_token -- no bearer token, or it is invalid or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"
        "403":
          description: insufficient_scope -- the token does not carry `openid`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"

  /oauth/consent:
    post:
      tags: [oauth]
      summary: Describe an authorization request to the consent page
      description: |
        What the consent page on the ur.io origin needs to render: who is
        asking, for what scopes, and whether consent is actually required. The
        caller is the consent page passing through the signed-in user's
        URnetwork JWT.

        The authorization request is validated here, BEFORE anything is
        rendered, so a hostile request never reaches a screen that could be
        used to phish approval; an invalid request is reported to the user
        rather than redirected, because a redirect uri is only trustworthy
        once it has matched the client's registered set. `prompt=consent`
        forces the screen even when the scopes are already approved. `issuer`
        is returned so the page can echo `iss` when the user declines, as
        rfc 9207 requires on error responses too.
      operationId: Oauth Consent
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthConsentRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthConsentResult"
        "400":
          description: The request is malformed, or the client or redirect_uri could not be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"
        "401":
          description: login_required -- no signed-in URnetwork session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"

  /oauth/authorize:
    post:
      tags: [oauth]
      summary: Mint an authorization code for an approved request
      description: |
        Mint the authorization code for a request the user approved, and
        return the redirect the consent page should follow. The caller is the
        ur.io consent page passing through the signed-in user's URnetwork JWT.
        Consent is recorded HERE rather than when the screen is shown, so an
        abandoned screen grants nothing. The redirect carries `code`, the
        request's `state` when it had one, and `iss` per rfc 9207 so the
        client can detect a mix-up attack.
      operationId: Oauth Authorize
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OauthConsentRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthAuthorizeResult"
        "400":
          description: The request is malformed, or the redirect could not be built.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"
        "401":
          description: login_required -- no signed-in URnetwork session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OauthError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: URnetwork JWT
    BrevoWebhookAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic with a secret from the account's `webhook_bearers` list
        (vault `brevo.yml`) as the username and an empty password. Not a
        URnetwork JWT.
    AdminBearerAuth:
      type: http
      scheme: bearer
      description: |
        An admin bearer listed in vault `onboarding.yml` under
        `onboarding.admin_bearers`, compared in constant time. It is NOT a
        URnetwork JWT: a network JWT here is a 403, and without the vault
        entry the endpoint is closed.
    CompetitionBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        A competition submitter or operator token from vault
        `competition.yml`, compared by sha256 in constant time. It is an
        opaque role-scoped token, NOT a URnetwork JWT, and names no network.
    OperatorSecret:
      type: apiKey
      in: header
      name: X-UR-Operator-Secret
      description: |
        The shared operator secret of the provider probe control plane, from
        vault `provider_egress.yml` `ingest_secret`, compared in constant
        time. This is not a JWT and names no network. A deployment whose vault
        has no such resource rejects every request to these routes.

  schemas:
    ClockResult:
      type: object
      required:
        - total_transfer_byte_count
        - since_block
        - since_time
      properties:
        total_transfer_byte_count:
          type: string
          pattern: "^[0-9]+$"
          description: |
            Base-10 destination-reported bytes for contracts finalized since
            since_block. This is a string so clients do not lose integer
            precision as the lifetime total grows.
        since_block:
          type: integer
          description: First subnet block included in the counter.
        since_time:
          type: string
          format: date-time
          description: UTC start time of since_block.

    ProvideMode:
      type: integer
      oneOf:
        - title: ProvideModeDefault
          const: -1
        - title: ProvideModeNone
          const: 0
        - title: ProvideModeNetwork
          const: 1
        - title: ProvideModeFriendsAndFamily
          const: 2
        - title: ProvideModePublic
          const: 3
        - title: ProvideModeStream
          const: 4

    ProxyClient:
