    VerifySeedArgs:
      type: object
      description: |
        SEED request body - starts a new trail. seed_sig is an Ed25519
        signature over the canonical SEED message
        (ctx "urnetwork/verify/v1", msg_type 0x01), not over this JSON.
      required:
        - client_id
        - vpk
        - client_nonce
        - seed_sig
        - M
      properties:
        client_id:
          description: uuid. The validator's own client_id; the server checks vpk equals this client's registered Ed25519 key.
          type: string
        vpk:
          description: base64 encoded 32-byte Ed25519 validator path key.
          type: string
        client_nonce:
          description: base64 encoded 32-byte nonce.
          type: string
        seed_sig:
          description: base64 encoded 64-byte Ed25519 SEED signature.
          type: string
        M:
          description: Requested trail depth. The server clamps to its allowed range.
          type: integer

    VerifyExtendArgs:
      type: object
      description: |
        EXTEND request body - claims the pending assigned hop. extend_sig is
        an Ed25519 signature over the canonical EXTEND message
        (ctx "urnetwork/verify/v1", msg_type 0x02), not over this JSON.
      required:
        - client_id
        - trail_id
        - trail
        - extend_sig
      properties:
        client_id:
          description: uuid. The validator's own client_id.
          type: string
        trail_id:
          description: uuid
          type: string
        trail:
          description: The ordered confirmed hop client_ids plus the single pending hop being claimed.
          type: array
          items:
            description: uuid
            type: string
        extend_sig:
          description: base64 encoded 64-byte Ed25519 EXTEND signature.
          type: string

    VerifyAssignResult:
      type: object
      description: |
        Non-final /verify response - the server's signed commitment to the
        next hop. The next EXTEND submits trail + next_hop.
      properties:
        trail_id:
          description: uuid
          type: string
        server_nonce:
          description: base64 encoded 32-byte per-trail server nonce.
          type: string
        trail:
          description: The ordered confirmed hop client_ids (ids only; times are published only in the final proof).
          type: array
          items:
            description: uuid
            type: string
        next_hop:
          description: uuid. The newly assigned pending hop.
          type: string
        M:
          description: The server-clamped effective trail depth.
          type: integer
        server_key_id:
          description: 1-byte id of the server key that signed assign_sig. See /verify/keys.
          type: integer
        assign_sig:
          description: base64 encoded 64-byte Ed25519 ASSIGN signature by the server (msg_type 0x03).
          type: string

    VerifyFinalResult:
      type: object
      description: Final /verify response at depth M.
      properties:
        status:
          description: '"complete"'
          type: string
        proof:
          $ref: "#/components/schemas/VerifyProof"

    VerifyProofHeader:
      type: object
      properties:
        trail_id:
          description: uuid
          type: string
        server_nonce:
          description: base64 encoded 32-byte per-trail server nonce.
          type: string
        vpk:
          description: base64 encoded 32-byte Ed25519 validator path key.
          type: string
        M:
          description: Trail depth.
          type: integer

    VerifyProofHop:
      type: object
      properties:
        client_id:
          description: uuid. The canonical provider at this hop.
          type: string
        time_ms:
          description: Server-stamped confirmation time, unix milliseconds UTC.
          type: integer
        egress_ip_hash:
          description: |
            The 32-byte hash of the provider's egress IP at the subnet's
            configured prefix granularity. Marshals on the wire as a JSON
            array of 32 integers (a Go [32]byte), not a base64 string.
          type: array
          items:
            type: integer

    VerifyProof:
      type: object
      description: |
        The published, non-repudiable completed trail. final_sig verifies
        under the /verify/keys key for server_key_id (msg_type 0x04);
        verifier_sig is the validator's depth-M EXTEND signature
        (msg_type 0x02).
      properties:
        header:
          $ref: "#/components/schemas/VerifyProofHeader"
        hops:
          type: array
          items:
            $ref: "#/components/schemas/VerifyProofHop"
        server_key_id:
          description: 1-byte id of the server key that signed final_sig.
          type: integer
        coverage:
          description: |
            The server-attested coverage of the trail (v1 = M-1, the
            server-assigned confirmed hops with the seed excluded).
          type: integer
        final_sig:
          description: base64 encoded 64-byte Ed25519 FINAL signature by the server.
          type: string
        verifier_sig:
          description: base64 encoded 64-byte Ed25519 depth-M EXTEND signature by the validator.
          type: string

    VerifyServerKey:
      type: object
      properties:
        server_key_id:
          description: 1-byte key rotation id.
          type: integer
        public_key:
          description: base64 encoded 32-byte Ed25519 public key.
          type: string

