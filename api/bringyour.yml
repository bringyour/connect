    OauthConsentResult:
      type: object
      properties:
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        scopes:
          description: The requested scopes, filtered to the supported set.
          type: array
          items:
            type: string
        network_name:
          type: string
        issuer:
          description: Echoed as `iss` when the user declines, per rfc 9207.
          type: string
        consent_required:
          type: boolean
