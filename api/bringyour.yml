openapi: "3.1.0"
info:
  version: 2026.9.14
  title: URnetwork
  description: |
    URnetwork is a web-standards VPN marketplace with an emphasis on
    fast, secure internet everwhere.

    The API for URnetwork bootstraps the `connect` protocol,
    and is the source of JWTs and other match-making transactions.

    The JWT returned by /auth routes does not have a clientId.
    The `connect` protocol requires a JWT with a clientId.
    Use the /network routes to obtain a JWT with a clientId.

    In URnetwork:
    - a network name is a globally unique subnet (xyz.ur.network)
    - a clientId is a globally unique 16-byte address
    - clientIds are equivalent to IPv6, but are expressed as UDID
    - clients also have an IPv6 and IPv4 mapped to their clientId

    Outside of IP translation like taptun/utun,
    clients are typically addressed via their clientId.

    Unless otherwise specified, time/date strings will be formatted
    in the Go default `2006-01-02 15:04:05.999999999 -0700 MST` (RFC 3339).

    Responses may include additional fields beyond those documented here.
    Clients should ignore unknown fields (be liberal in what you accept).

  termsOfService: https://ur.io/terms
  contact:
    name: URnetwork
    email: support@ur.io
    url: https://ur.io
  x-logo:
    url: https://bringyour.com/res/images/URnetwork-logo-black-400-80.svg
    altText: URnetwork
  license:
    name: Mozilla Public License, v. 2.0
    url: https://mozilla.org/MPL/2.0/
servers:
  - url: https://api.bringyour.com
    description: |
      The api, on whichever address family the caller's resolver picks.
  - url: https://api-v4.bringyour.com
    description: |
      The IPv4-only api host. A request here always arrives from an IPv4
      caller address, which is what `POST /network/extender-activate` needs:
      the operator probes the caller back on the family it was reached on.
  - url: https://api-v6.bringyour.com
    description: |
      The IPv6-only api host, the counterpart of api-v4 for an extender
      activating its IPv6 address.

security:
  - BearerAuth: []

tags:
  - name: onboarding
    description: |
      The new-user onboarding program (mmm/onboarding/PLAN.md): the welcome
      offer, the campaign landing and feedback links, and the sign-up
      preferences the campaign honors.
  - name: analytics
    description: |
      Product events and experiment results behind the onboarding
      optimization loop: the closed client event schema, the experiment
      registry and the aggregated results the analysis script reads.
  - name: subscription
    description: Pro subscriptions, prices and the store purchase paths.
  - name: store webhooks
    description: |
      The server-to-server notifications the payment processors and the app
      stores post here. None of them carries a URnetwork JWT: each is
      authenticated by the sender's own scheme, checked before the body is
      parsed -- the Stripe signature header, the Coinbase and Helius shared
      secrets, the Google Pub/Sub push claim, the Circle ECDSA notification
      signature, and, for the App Store, a JWS chain that must terminate at a
      pinned Apple root. The bodies below list only the fields the server
      reads; every sender posts more, and a sender may add more at any time.
  - name: extenders
    description: |
      The extender network (connect/EXTENDER.md): volunteer relays that carry
      the connect protocol over an ordinary-looking carrier (tls, quic or dns)
      into the platform, so a client on a network that blocks URnetwork still
      reaches it. An extender proves itself by being probed from the outside
      before it is published, and clients discover extenders from signed
      records -- their own on activation, everyone else's over gossip.
  - name: provider probing
    description: |
      The operator-to-server control plane of the provider probe fleet: the
      queues of which providers are due to be probed, the measurements the
      prober submits back (egress location, egress health, blackhole checks,
      bandwidth), and the credential and certificate pins the prober itself
      fetches. These routes are NOT authenticated by a network JWT. They carry
      the shared operator secret in an `X-UR-Operator-Secret` header, checked
      in constant time against `provider_egress.yml` `ingest_secret`; a
      deployment whose vault has no such resource rejects every request. The
      one exception is `POST /network/provider-verdict`, which a real client
      network calls with its own session.
  - name: competition
    description: |
      The sim-latency competition: a separate, fail-closed security domain
      served by this api process. Health, published policy, the round
      workload and the leaderboard are public; round control and scoring use
      role-scoped opaque bearer tokens from `competition.yml` (`operator` for
      round control, any listed token for scoring), never a network JWT. The
      competition answers `503` until it is configured and enabled.

      These operations are listed here because this api process serves them;
      `sn/api/competition.yml` is the competition's own, fuller document and
      is the one to read for the round lifecycle and the embargo rules.
  - name: x402
    description: |
      Inline agent payments over the x402 header protocol: an agent asks for a
      sku, is answered `402` with the payment terms, and retries the same
      request with a signed payment in `X-PAYMENT`. Both routes answer `404`
      while x402 is not configured and enabled (vault `x402.yml`).
  - name: subnet evidence
    description: |
      The public, content-addressed evidence surface of the subnet: immutable
      payout artifacts and signed release-evidence envelopes, addressed by
      their sha256 content hash and paged by their history prefix, plus the
      client-key observation endpoints a client uses to publish and read a
      signed key history. Reads are public and immutable; writes are either an
      authenticated client session under a byte budget or the operator's own
      artifact signature.
  - name: oauth
    description: |
      The OAuth 2.1 / OpenID Connect authorization server (server/IDP.md).
      Its issuer is a separate hostname that the load balancer routes to this
      same service, so these paths answer on either host; the issuer published
      in the discovery documents is the one clients use. Authentication here
      is the OAuth mechanism of each endpoint -- a PKCE code, a refresh token,
      an access token -- except `/oauth/authorize` and `/oauth/consent`, which
      the ur.io consent page calls with the signed-in user's URnetwork JWT.

paths:
  /privacy.txt:
    get:
      description: |
        Redirect (303) to the canonical privacy policy on bringyour.com.
        The api serves the redirect so a client that only knows the api host
        can still reach the policy.
      operationId: Privacy Txt
      security: []
      responses:
        "303":
          description: Redirect to https://bringyour.com/privacy.txt
          headers:
            Location:
              schema:
                type: string

  /terms.txt:
    get:
      description: |
        Redirect (303) to the canonical terms of service on bringyour.com.
      operationId: Terms Txt
      security: []
      responses:
        "303":
          description: Redirect to https://bringyour.com/terms.txt
          headers:
            Location:
              schema:
                type: string

  /vdp.txt:
    get:
      description: |
        Redirect (303) to the vulnerability disclosure policy on
        bringyour.com.
      operationId: Vdp Txt
      security: []
      responses:
        "303":
          description: Redirect to https://bringyour.com/vdp.txt
          headers:
            Location:
              schema:
                type: string

  /status:
    get:
      description: |
        The serving status of the api process that answered, used by the
        deploy poll and by fleet status sampling. `status` is a latched value
        rather than a per-request health check, so this route stays O(1) and
        never couples a deploy poll to database load: "ok" while the process
        serves, a string beginning `error` while it is not ready (which fails
        a deploy poll), and "draining" from SIGTERM onwards (deliberately not
        an error, so an operator-initiated drain is not counted as a service
        error). `host`, `service` and `block` name the process that answered,
        and `client_address` is the caller address it observed.
      operationId: Warp Status
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarpStatusResult"

  /clock:
    get:
      description: |
        Get the cumulative destination-reported bytes for contracts finalized
        on or after the start of subnet block 9.
        The counter advances when contracts reach a final outcome and is
        intended for public clients polling every 1-5 seconds.
      operationId: Clock
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockResult"
        "503":
          description: The clock has not completed its initial block-9 backfill.

  # ----- sim-latency competition -----

  /competition/healthz:
    get:
      tags: [competition]
      summary: Competition liveness
      description: |
        Liveness of the competition subsystem. Always answers 200 with the
        process version and time; it takes no locks and reads no storage, so
        it stays up even when the competition is unconfigured.
      operationId: CompetitionHealth
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionHealthResult"

  /competition/readyz:
    get:
      tags: [competition]
      summary: Competition readiness
      description: |
        Whether the competition can accept and evaluate submissions: one
        boolean per named check. Requires the `operator` role token.
      operationId: CompetitionReady
      security:
        - CompetitionBearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionReadinessResult"
        "401":
          description: Missing or non-operator competition token.
        "503":
          description: Not ready; the body is the competition error, with `readiness` filled in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /competition/info:
    get:
      tags: [competition]
      summary: The published competition policy
      description: |
        The competition's published policy: the scorer version and schema, the
        base commit and evaluator image digest the evaluation pins, the patch,
        evaluation and season policies, and the active and staging rounds when
        they exist. Public, so an entrant can reproduce the evaluation before
        submitting.
      operationId: CompetitionInfo
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfoResult"
        "503":
          description: The competition configuration is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /competition/leaderboard:
    get:
      tags: [competition]
      summary: The season leaderboard
      description: |
        Every finalized epoch of the season with its ranked entries. Scores
        stay embargoed while an epoch is in review, so a closed epoch appears
        only once it is finalized. Public.
      operationId: CompetitionLeaderboard
      security: []
      parameters:
        - in: query
          name: include_staging
          required: false
          description: |
            `true` also lists the fee-free staging epochs, which are excluded
            by default. Must appear at most once, with exactly `true` or
            `false`.
          schema:
            type: boolean
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionSeasonLeaderboardResult"
        "400":
          description: include_staging was repeated or not true/false.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          description: The competition configuration is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /competition/round/{roundId}/providers.yml:
    get:
      tags: [competition]
      summary: The round's workload file
      description: |
        The exact `providers.yml` workload the round is evaluated against,
        served as `application/yaml` with its sha256 in both `ETag` and
        `X-Content-SHA256`. The bytes are immutable for the life of the round
        and are cached accordingly. Public.
      operationId: CompetitionGetRoundWorkload
      security: []
      parameters:
        - in: path
          name: roundId
          required: true
          description: udid. The round id.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/yaml:
              schema:
                type: string
        "400":
          description: The round id is missing or malformed.
        "404":
          description: No such round.
        "503":
          description: The competition configuration or round storage is not ready.

  /competition/generate-round:
    post:
      tags: [competition]
      summary: Open a production round
      description: |
        Create the next production round over the given window. Requires the
        `operator` role token.
      operationId: CompetitionGenerateRound
      security:
        - CompetitionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionGenerateRoundArgs"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "400":
          description: The window is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "401":
          description: Missing or non-operator competition token.
        "409":
          description: The window overlaps an existing round, or a staging evaluation is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          description: The competition configuration or storage is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /competition/generate-staging-round:
    post:
      tags: [competition]
      summary: Open a staging round
      description: |
        Create or explicitly replace the staging-era epoch. An empty body
        keeps the original operator call working and selects an immediately
        open 48-hour window; supplied timestamps allow shorter integration
        cycles. `replace_current` is an explicitly destructive staging-only
        transition and never touches a production round. Requires the
        `operator` role token.
      operationId: CompetitionGenerateStagingRound
      security:
        - CompetitionBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionGenerateStagingRoundArgs"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "400":
          description: The window is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "401":
          description: Missing or non-operator competition token.
        "409":
          description: A staging round is already open, a staging evaluation is running, or the season has started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          description: The competition configuration or storage is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /competition/close-staging-round:
    post:
      tags: [competition]
      summary: Stop staging admissions
      description: |
        Stop new staging admissions without cancelling any accepted work; the
        worker still drains and finalizes what was admitted. Takes no body.
        Requires the `operator` role token.
      operationId: CompetitionCloseStagingRound
      security:
        - CompetitionBearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionRoundResult"
        "401":
          description: Missing or non-operator competition token.
        "409":
          description: There is no staging round to close.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          description: The competition configuration or storage is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /competition/score:
    post:
      tags: [competition]
      summary: Submit a patch for scoring
      description: |
        Submit a patch against an open round. The patch is validated and
        canonicalized against the published patch policy before anything is
        enqueued, so an oversized or out-of-policy patch never occupies the
        queue. The answer is `202` with a job handle; poll
        `GET /competition/score/{jobId}` (the same path is returned as
        `status_url`). Resubmitting an identical canonical patch is answered
        from the cache (`cache_hit: true`) rather than evaluated again.
        Requires any competition bearer token.
      operationId: CompetitionSubmitScore
      security:
        - CompetitionBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitionScoreArgs"
      responses:
        "202":
          description: Accepted for evaluation, or answered from the cache.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreAcceptedResult"
        "401":
          description: Missing or invalid competition token.
        "404":
          description: No such round.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "409":
          description: The round is not open for submissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "413":
          description: The patch or the request body is over its limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "422":
          description: The patch violates the published patch policy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          description: The competition configuration, evaluator or storage is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /competition/score/{jobId}:
    get:
      tags: [competition]
      summary: A scoring job
      description: |
        The state of one scoring job and, once the round publishes, its score.
        Requires any competition bearer token; a submitter sees its own job.
      operationId: CompetitionGetScore
      security:
        - CompetitionBearerAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          description: udid. The job id from the submission.
          schema:
            type: string
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionScoreJobResult"
        "400":
          description: The job id is missing or malformed.
        "401":
          description: Missing or invalid competition token.
        "404":
          description: No such job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"
        "503":
          description: The competition configuration or storage is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionError"

  /stats/last-90:
    get:
      description: |
        Get network statistics for the last 90 days.
        The statistics are updated approximately every 60s.
      operationId: Stats Last 90
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResult"

  /stats/providers-map:
    get:
      tags: [extenders]
      summary: Provider and extender density by region
      description: |
        The provider-density map behind the public map page: how many public
        providers and how many online extenders sit in each region, with a
        representative point to draw them at.

        The body is a bare two-level map, `country code -> region name ->
        {provider_count, extender_count, lat, lon}`. The country code is the
        lowercase ISO 3166-1 alpha-2 code as the location table stores it, and
        the region name is the region's own name (for an extender located only
        to its country, the country location's name, whose point is the
        country centroid).

        Providers and extenders are two independent populations over the same
        key, so a region with extenders and no providers appears with
        `provider_count` 0, and a region with providers and no extenders with
        `extender_count` 0. `extender_count` is always present, never omitted:
        a region without it is an old blob, and a client must not read that
        the same way as a present zero. A region whose centroid is unknown is
        left out entirely.

        Like `/stats/last-90` this serves a redis-exported blob rather than a
        live query, refreshed every 5 minutes by the `ExportProvidersMap`
        task, so it never touches the database on the request path.
      operationId: Stats Providers Map
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvidersMapResult"
        "500":
          description: The exported map is not in redis yet.

  /stats/providers:
    get:
      description: |
        Get all providers in the caller network.
        Each provider includes stats from the last 24 hours.
      operationId: Stats Providers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersResult"

  /stats/providers-last-n:
    post:
      description: |
        Get all providers in the caller network.
        Each provider includes stats from the last n hours.
      operationId: Stats Providers Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProvidersArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersResult"

  /stats/provider-last-n:
    post:
      description: |
        Get detailed stats on a single provider in the caller network.
        This is meant to give the user complete visibility over usage.
      operationId: Stats Provider Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProviderArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProviderResult"

  /stats/providers-overview-last-n:
    post:
      description: |
        Get a network-wide time series aggregated across all providers in the
        caller network, over the last n hours.
      operationId: Stats Providers Overview Last N hours
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProvidersOverviewArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersOverviewResult"

  /stats/providers-overview-last-90:
    get:
      description: |
        Legacy alias of `/stats/providers-overview-last-n` with the lookback
        fixed at 90 days, kept for callers that predate the route migration.
        New callers should use `/stats/providers-overview-last-n`.
      operationId: Stats Providers Overview Last 90
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProvidersOverviewResult"

  /stats/provider-last-90:
    post:
      description: |
        Legacy alias of `/stats/provider-last-n`, kept for callers that
        predate the route migration. A request that names neither `last_n` nor
        `lookback` is served with a 90-day lookback; otherwise it behaves
        exactly like `/stats/provider-last-n`. New callers should use
        `/stats/provider-last-n`.
      operationId: Stats Provider Last 90
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsProviderArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsProviderResult"

  /stats/leaderboard:
    post:
      description: |
        Fetches top 100 current leaderboard. This data is refreshed every payout.
      operationId: Stats Leaderboard
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetLeaderboardArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResult"

  /stats/points-leaderboard:
    post:
      description: |
        Page the all-time points leaderboard. Every network with points is
        ranked on three dimensions (total points, finalized epochs with points
        = "blocks", current streak of consecutive finalized epochs with points)
        with competition ranks (1, 2, 2, 4), and every ranked network is
        listed: the pages form one continuous list. A row carries the network
        name only when that network turned on
        /network/points-ranking-visibility (its "show my network name"
        switch); otherwise the row is anonymous. The emoji tag (/network/emoji)
        shows on every row that set one.
        Each sort has its own tie-break order, every key descending, then the
        network id ascending so the order is total: `points` = (points,
        streak, blocks), `blocks` = (blocks, streak, points), `streak` =
        (streak, blocks, points). The pages come in exactly that order, and a
        rank is shared only by networks whose three values all tie.
        Pages use a keyset cursor pinned to a ranking snapshot (rebuilt when an
        epoch finalizes, when a payout plan commits, and hourly); a cursor
        whose snapshot was pruned returns `restart: true` and the client
        reloads from the top. No authentication is required; with a bearer
        token the response also carries `me`, the caller's own row with its
        network name for the caller's own card, whether or not it opted in.
        In the list itself the caller's row is anonymous like everyone
        else's until it opts in: the caller sees what everyone sees, and the
        apps only highlight that row.
      operationId: Stats Points Leaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PointsLeaderboardArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointsLeaderboardResult"

  /auth/login:
    post:
      description: |
        Start a login for a user authority.
        The user authority may be:
        - email
        - phone number
        - Apple JWT
        - Google JWT
        - a wallet (`wallet_auth`): a Solana or Bittensor signature over the
          single-use challenge from /auth/wallet-challenge. A bound wallet
          returns `network.by_jwt`; an unbound wallet echoes `wallet_auth`
          and the client continues to /auth/network-create with a fresh
          challenge.
        - a seedphrase
      operationId: Auth Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResult"

  /auth/wallet-challenge:
    post:
      description: |
        Issue a single-use wallet sign-in challenge. The wallet signs the
        returned `message_template` byte for byte; the signature is then
        submitted as `wallet_auth` to /auth/login, /auth/network-create or
        /auth/add-auth, each of which consumes one challenge. The message is
        exactly three LF-separated lines: `Sign in to URnetwork`,
        `Challenge: <challenge>` and `Timestamp: <unix seconds>`; the server
        rejects any other text (`400 invalid message format`), a challenge
        that is unknown, expired (5 minutes), already used, issued for another
        blockchain or address, or whose timestamp differs from the issued one.
        Bittensor (TAO) wallets sign with sr25519 in the `substrate` context;
        both the raw text and the polkadot-js `<Bytes>…</Bytes>`-wrapped form
        of the signature verify, and the unwrapped text is what the client
        submits. Rate limited per client address. See server/BITTENSOR-LOGIN.md.
      operationId: Auth Wallet Challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthWalletChallengeArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthWalletChallengeResult"

  /auth/wallet-nonce:
    post:
      description: |
        Issue a fresh single-use, short-lived (5 minute) nonce for wallet
        login. The client embeds the returned nonce in the message it signs
        and echoes it back as `wallet_auth.wallet_nonce`; the server validates
        and consumes it in the same transaction as the login, so a captured
        (message, signature) pair cannot be replayed. The nonce is optional
        during the client rollout and enforced whenever it is present.

        This is the older, narrower anti-replay token. `/auth/wallet-challenge`
        supersedes it: that one returns the exact message text to sign and
        binds the challenge to a blockchain and an address.
      operationId: Auth Wallet Nonce
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthWalletNonceResult"

  /auth/login-with-password:
    post:
      description: |
        Password login for email and phone number.
      operationId: Auth Login With Password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginWithPasswordArgs"
      responses:
        "200":
