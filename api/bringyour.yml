              $ref: "#/components/schemas/WalletCircleTransferOutArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletCircleTransferOutResult"

  /subscription/balance:
    get:
      tags: [subscription]
      summary: Subscription status, balance and the onboarding plan data
      description: |
        Get the current subscription status and transfer balance. This is also
        the PLAN response of the onboarding program: it carries the caller's
        regional `price_tier`, the welcome `onboarding_offer` (null when none
        was issued) and the `experiments` assignments per surface.

        Regional pricing rule (mmm/onboarding/PLAN.md): the tier is resolved,
        in order, from `storefront_country` (the store's storefront country,
        sent by the Apple and Google apps), the Stripe customer's billing
        country when a customer exists, else the client IP as a DISPLAY
        ESTIMATE (`price_tier.estimate: true`). The store charges its own
        storefront's price; the Stripe tier actually charged is finalized from
        the card's billing country once the payment method is attached, before
        the trial ends. The regional price is tied to the storefront/billing
        country, never to a VPN exit.
      operationId: subscriptionBalance
      security:
        - BearerAuth: []
      parameters:
        - name: storefront_country
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2 (or alpha-3) storefront country of the app's
            store (StoreKit `Storefront.countryCode`, Play billing region).
          schema:
            type: string
      responses:
        "200":
          description: The balance, subscription and onboarding plan data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionBalanceResult"

  /subscription/details:
    get:
      description: |
        The "Manage subscription" screen: every store currently billing the
        caller's network, one entry per store, with the window it bought
        (`end_time` is the expiry, or the next renewal date when the store
        renews), the store's auto-renew state and the control that stops it.

        `auto_renew` is true/false when the store answered and null when the
        store lookup failed (best-effort, ~5 s per store; the entry still
        carries the window from our own records). `can_cancel` is true only
        for Stripe, which /subscription/cancel acts on; Apple and Google
        entries carry the store's own subscriptions page in `manage_url` (a
        subscription is cancelled where it is billed); a Solana entry is a
        one-time USDC payment that never renews. `has_stripe_customer` gates
        the Stripe billing portal (/stripe/customer-portal errors without one).

        The result is cached per network for 60 seconds; cancel and resume
        invalidate it.
      operationId: Subscription Details
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetailsResult"

  /subscription/cancel:
    post:
      description: |
        Stop the Stripe subscription billing the caller's network at the end of
        the paid period (`cancel_at_period_end`); the customer keeps Pro until
        `end_time`. Only `store` "stripe" (the default) is acted on: the other
        stores answer with `error.message` and, for Apple/Google, the store's
        subscriptions page in `manage_url`. Idempotent: an already-cancelling
        subscription is not written again.
      operationId: Subscription Cancel
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCancelArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancelResult"

  /subscription/resume:
    post:
      description: |
        Undo /subscription/cancel while the paid period is still running: the
        Stripe subscription renews again. Same request and result shapes.
      operationId: Subscription Resume
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCancelArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancelResult"

  /subscription/check-balance-code:
    post:
      description: |
        Check if the balance code is valid.
      operationId: Subscription Check Balance Code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCheckBalanceCodeArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckBalanceCodeResult"

  /subscription/redeem-balance-code:
    post:
      description: |
        Redeem the balance code and add the transfer balance to the caller network.
      operationId: Subscription Redeem Balance Code
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionRedeemBalanceCodeArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionRedeemBalanceCodeResult"

  /subscription/create-payment-id:
    post:
      description: |
        Creates an anonymous payment identifier to be used with purchases.
        This keeps network information out of the payment processor system.
        For example in Google Play this is called the "obfuscated account id".
      operationId: Subscription Create Payment Id
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionCreatePaymentIdArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCreatePaymentIdResult"

  /subscription/verify-play-purchase:
    post:
      tags: [subscription]
      summary: Report a Play purchase for verification
      description: |
        The android app reports its purchase token BEFORE acknowledging it.
        The server verifies the token with the Android Publisher API and
        credits it through the same advisory-lock gate as the RTDN webhook and
        the payment reconciler, so this is idempotent against both. Because
        the client only acknowledges after a terminal answer, a lost webhook is
        no longer lost money: the store keeps redelivering the proof to the
        client until the server has seen it.

        `credited`, `already_credited`, `wrong_network` and `invalid` are
        TERMINAL -- stop retrying and finalize with the store. `pending` is
        retryable (the purchase is on hold, paused or in its grace period), as
        is any non-2xx, which is a transport or store failure and carries no
        status. `wrong_network` means the token's linked account is a
        different network than the session's. The credited sku is always the
        store's, never the client's.

        Shares a per-account budget with the Apple endpoint; every attempt
        counts, including failures.
      operationId: Subscription Verify Play Purchase
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyPlayPurchaseArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyStorePurchaseResult"
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: The per-account verify budget is exhausted.

  /subscription/verify-apple-transaction:
    post:
      tags: [subscription]
      summary: Report a StoreKit transaction for verification
      description: |
        The Apple app reports its StoreKit transaction JWS
        (`Transaction.jwsRepresentation`) BEFORE calling `finish()`. A client
        report is an unauthenticated-content push, so the JWS goes through the
        FULL pinned-root webhook verifier -- ES256, a three-certificate x5c
        chain carrying Apple's policy extensions, terminating at a pinned
        Apple root, with the chain judged at the JWS's own `signedDate` -- and
        the bundle and environment must match this app. The signed-date
        freshness window is deliberately NOT applied, because a report may
        legitimately be retried days after the purchase; that is the whole
        point of the retryable reporting path.

        The verified claims then credit through the same transaction ledger
        gate as the notification webhook and the reconciler. Statuses are the
        same as the Play endpoint: a JWS that fails verification is terminal
        `invalid`, never an error, so the client stops retrying.

        Cheap validation runs first, then the shared per-account budget, then
        the cryptographic verification -- so a malformed request burns no
        budget and an over-budget caller burns no CPU.
      operationId: Subscription Verify Apple Transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAppleTransactionArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyStorePurchaseResult"
        "401":
          description: Missing or invalid bearer token.
        "429":
          description: The per-account verify budget is exhausted.

  # ----- x402 inline agent payments -----

  /x402/skus:
    get:
      tags: [x402]
      summary: What an agent can buy
      description: |
        The catalog an agent can buy from, so a skill can discover it without
        triggering a `402`. Prices come from `pro.yml`, never from the x402
        configuration, so an agent is quoted the same number a human pays by
        card; a sku with no price is not offered at all.
      operationId: X402 Skus
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/X402SkusResult"
        "404":
          description: x402 is not configured or not enabled on this deployment.

  /x402/purchase:
    post:
      tags: [x402]
      summary: Quote or settle an inline payment
      description: |
        Buy a sku inline. Without an `X-PAYMENT` header the answer is `402`
        carrying the payment terms; the agent signs them and retries the SAME
        request with the signed payment in `X-PAYMENT`, which is settled and
        granted. The receipt is returned both as the body and in the
        `X-PAYMENT-RESPONSE` header. Requires a network session.

        The same 402 round trip is also carried inline by
        `POST /network/auth-client`, where an agent meets the plan's
        concurrent-client limit.
      operationId: X402 Purchase
      security:
        - BearerAuth: []
      parameters:
        - in: header
          name: X-PAYMENT
          required: false
          description: The signed payment for terms previously quoted by a 402.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/X402PurchaseArgs"
      responses:
        "200":
          description: Settled and granted. The receipt is also in `X-PAYMENT-RESPONSE`.
          headers:
            X-PAYMENT-RESPONSE:
              description: The receipt, JSON encoded.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/X402PurchaseResult"
        "400":
          description: No `sku_id`, or the body could not be parsed.
        "401":
          description: Missing or invalid bearer token.
        "402":
          description: Payment required; the body carries the terms to sign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/X402PaymentRequired"
        "404":
          description: x402 is not configured or not enabled on this deployment.
        "502":
          description: Settlement failed at the facilitator.

  # ----- store and processor notifications -----

  /pay/stripe:
    post:
      tags: [store webhooks]
      summary: Stripe webhook
      description: |
        The Stripe webhook. Authenticated by the `Stripe-Signature` header
        over the raw body, verified before the event is parsed; there is no
        URnetwork JWT. The subscription is granted here, never by the client.
        Only the fields the server reads are listed; Stripe sends a much
        larger event.
      operationId: Stripe Webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StripeWebhookArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StripeWebhookResult"

  /pay/coinbase:
    post:
      tags: [store webhooks]
      summary: Coinbase Commerce webhook
      description: |
        The Coinbase Commerce webhook, authenticated by the
        `X-CC-Webhook-Signature` HMAC over the raw body with the shared
        secret, checked before the event is parsed. Only the fields the server
        reads are listed.
      operationId: Coinbase Webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinbaseWebhookArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinbaseWebhookResult"

  /pay/play:
    post:
      tags: [store webhooks]
      summary: Google Play real-time developer notification
      description: |
        The Play RTDN push, delivered through Google Pub/Sub and
        authenticated as a Pub/Sub push -- the `Authorization` bearer is
        verified as a Google-signed OIDC token before the body is parsed. The
        notification
        itself is base64 inside `message.data`; the server decodes it and
        credits the renewal through the same advisory-lock gate as
        `/subscription/verify-play-purchase` and the payment reconciler.
      operationId: Play Webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayWebhookArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayWebhookResult"

  /pay/solana:
    post:
      tags: [store webhooks]
      summary: Helius USDC transfer webhook
      description: |
        The Helius webhook for USDC transfers on Solana. Authenticated by the
        configured shared secret in the `Authorization` header, checked before
        the body is parsed. The server matches a transfer to a payment intent
        by the Solana Pay reference among the transaction's account keys, or
        by the memo text, and credits the plan or the data pack (see
        `/solana/payment-intent` and `/pay/data/solana-intent`).

        The body is Helius's own enhanced-transaction ARRAY, not a wrapped
        object. One delivery carries a batch, and a customer's payment can sit
        behind any number of unrelated transfers, so a transaction that does
        not match is skipped rather than returned on. A per-transaction
        failure is reported only after the whole batch is examined, as a
        non-2xx, so Helius redelivers everything; the already-credited
        intents are no-ops on the retry.
      operationId: Helius Webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Helius enhanced transactions, as Helius sends them.
              items:
                type: object
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeliusWebhookResult"

  /pay/circle:
    post:
      tags: [store webhooks]
      summary: Circle notification (deprecated)
      description: |
        The Circle programmable-wallets notification, authenticated by the
        `X-Circle-Signature` ECDSA signature over the raw body under the key
        named by `X-Circle-Key-Id`. Deprecated; it is the same handler as
        `POST /account/circle-wallet`.
      operationId: Circle Webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircleChallengeNotification"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleWalletWebhookResult"

  /account/circle-wallet:
    post:
      tags: [store webhooks]
      summary: Circle wallet challenge notification
      description: |
        The Circle notification that a user-custody wallet challenge
        completed. Authenticated by the `X-Circle-Signature` ECDSA signature
        over the raw body under the key named by `X-Circle-Key-Id`, not by a
        URnetwork JWT. A `challenges.initialize` notification
        whose event is a completed `INITIALIZE` links the created wallet to
        the network named by the challenge's correlation id. Same handler as
        `POST /pay/circle`.
      operationId: Circle Wallet Webhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CircleChallengeNotification"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CircleWalletWebhookResult"

  /apple/notification:
    post:
      tags: [store webhooks]
      summary: App Store Server Notification V2
      description: |
        The App Store Server Notification V2 endpoint. The envelope carries
        one field, `signedPayload`, a compact JWS; unknown envelope fields are
        rejected and the body is capped at 1 MiB.

        Every JWS -- the notification and the signed transaction and renewal
        info nested inside it -- is verified independently: ES256, a
        three-certificate x5c chain carrying Apple's leaf and intermediate
        policy extensions, terminating at a PINNED Apple root, with the chain
        judged at the payload's own `signedDate`. The outer notification must
        additionally be within 24 hours old and no more than 5 minutes in the
        future, and its bundle id, environment and app Apple id must match
        this app; the nested payloads must match the outer notification. A
        `SUBSCRIBED`, `DID_RENEW` or `EXPIRED` notification without signed
        transaction info is rejected.

        Anything that fails is a `400` with no detail. A verified notification
        answers `200` with an empty object, whether or not it changed
        anything.
      operationId: Apple Notification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppleNotificationPayload"
      responses:
        "200":
          description: Verified and processed.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The envelope is malformed, or the notification failed verification.
        "413":
          description: The body is over 1 MiB.

  /device/add:
