          type: string

    ConnectControlResult:
      type: object
      properties:
        # unlike every other error field in this document, this one has no
        # omitempty on the server, so a successful response still carries
        # "error": null rather than omitting the key
        pack:
          description: |
            base64 encoded connect `Pack` resulting from processing the control messages.
            As an inline message, this is what would be sent from the control id after processing the control messages.
          type: string
        error:
          type: object
          properties:
            message:
              type: string

    HelloResult:
      type: object
      properties:
        client_address:
          type: string
        extender_root_public_keys:
          description: |
            The extender root keys whose record signatures this network space
            accepts, hex encoded. It arrives over the platform's pinned tls,
            so it is trustworthy even when the request itself travelled
            through an untrusted extender, and it REPLACES whatever list the
            client had stored. Absent when the operator has configured no
            extender network.
          type: array
          items:
            type: string
        gossip_peer_id:
          description: |
            The libp2p peer id of the operator's gossip node, derived from its
            gossip identity key. A member dials the operator only when it
            knows this id, since without it there is nothing to authenticate
            the far end of the dial against -- so an operator running no
            gossip service serves none rather than an address a member could
            not verify.
          type: string

