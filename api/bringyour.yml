        providers_sha256:
          type: string
        score_schema:
          type: integer
        opens_at:
          type: string
          format: date-time
        closes_at:
          type: string
          format: date-time
        reveal_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        admission_closed_at:
          type: string
          format: date-time
        finalized_at:
