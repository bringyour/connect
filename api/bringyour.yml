  # ----- provider probe control plane (operator-to-server) -----

  /network/provider-egress-due:
    get:
      tags: [provider probing]
      summary: Which providers are due an egress-location probe
      description: |
        The providers to probe next: those whose stored egress location has
        gone stale and those never probed at all, oldest first. A provider is
        skipped while it has a fresh success, a recent failed attempt (a much
        shorter backoff, so a provider that cannot be probed does not starve
        the queue), or a current explicit blackhole failure.
      operationId: Provider Egress Location Due
      security:
        - OperatorSecret: []
      parameters:
        - in: query
          name: limit
          required: false
          description: |
            Batch size, default 100, clamped to the deployment ceiling
            (`provider_egress_due.yml` `max_due_limit`, default 500). A
            non-integer or non-positive value is a 400 rather than a clamp,
            because an empty list must not be confused with "nothing is due".
          schema:
            type: integer
        - in: query
          name: shard_count
          required: false
          description: Partitions the queue across independent workers; default 1.
          schema:
            type: integer
        - in: query
          name: shard_index
          required: false
          description: This worker's partition, 0-based and below shard_count.
          schema:
            type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderClientIdsResult"
        "400":
          description: A limit or shard parameter is not usable.
        "401":
          description: Missing or wrong operator secret, or the deployment has none configured.

  /network/provider-egress-location:
    post:
      tags: [provider probing]
      summary: Submit a probed provider egress location
      description: |
        Store the egress location the prober measured THROUGH a provider's own
        tunnel, which the server then prefers over its built-in mmdb lookup
        against the provider's control-connection address. The body is capped
        at 16 KiB.
      operationId: Provider Egress Location Submit
      security:
        - OperatorSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProviderEgressLocationArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitProviderEgressLocationResult"
        "400":
          description: The body is malformed or the submission was rejected.
        "401":
          description: Missing or wrong operator secret.
        "413":
          description: The body is over 16 KiB.

  /network/provider-egress-attempt:
    post:
      tags: [provider probing]
      summary: Record a probe attempt
      description: |
        Record that the prober TRIED to probe a provider, whether or not the
        try produced a location. The prober reports failures here; a success
        is already implied by the stored location. Without this, a provider
        that can never be probed successfully would sort to the head of the
        due queue on every poll forever.
      operationId: Provider Egress Location Attempt
      security:
        - OperatorSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordProviderEgressProbeAttemptArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordProviderEgressProbeAttemptResult"
        "400":
          description: The body is malformed or the attempt was rejected.
        "401":
          description: Missing or wrong operator secret.
        "413":
          description: The body is over 16 KiB.

  /network/provider-blackhole-due:
    get:
      tags: [provider probing]
      summary: Which providers are due a blackhole check
      description: |
        The blackhole sweep queue: never-checked providers first, then least
        recently checked. A blackhole check is one request through a tunnel
        the prober already has, so the batches are much larger than the
        egress-location ones.
      operationId: Provider Blackhole Check Due
      security:
        - OperatorSecret: []
      parameters:
        - in: query
          name: limit
          required: false
          description: Batch size, default 500, capped at 5000. A non-positive value is a 400.
          schema:
            type: integer
        - in: query
          name: shard_count
          required: false
          schema:
            type: integer
        - in: query
          name: shard_index
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderClientIdsResult"
        "400":
          description: A limit or shard parameter is not usable.
        "401":
          description: Missing or wrong operator secret.

  /network/provider-blackhole-checks:
    post:
      tags: [provider probing]
      summary: Submit a batch of blackhole checks
      description: |
        Submit up to 10,000 blackhole results at once: for each provider, did
        anything get through. The WHOLE batch is validated before any of it is
        written, so a caller reporting fire-and-forget is never left unable to
        tell which results landed. `checked_at` is required and is never
        fabricated server-side (an "as of now" stamp would defeat the
        freshness bound the gate depends on) and may not be in the future; a
        failed check must name a failure class of at most 64 characters.
      operationId: Submit Provider Blackhole Checks
      security:
        - OperatorSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProviderBlackholeChecksArgs"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The batch is empty, too large, or one of its checks is invalid.
        "401":
          description: Missing or wrong operator secret.

  /network/provider-bandwidth-test:
    get:
      tags: [provider probing]
      summary: The active bandwidth probe's download target
      description: |
        Stream a bounded number of arbitrary bytes, so the prober has
        something to download THROUGH a provider's tunnel and time. Only the
        byte count matters; the content is a small repeating block streamed
        under a limit reader and never materialized. Operator-gated so the
        deployment is not a free public speed-test target.
      operationId: Provider Bandwidth Test
      security:
        - OperatorSecret: []
      parameters:
        - in: query
          name: bytes
          required: false
          description: |
            Bytes to stream. Default 1 MiB; clamped to 5 MiB. Absent,
            malformed or non-positive values take the default. One probe is 8
            parallel streams, and the aggregate is bounded by the
            reservation rather than by this clamp.
          schema:
            type: integer
      responses:
        "200":
          description: OK.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          description: Missing or wrong operator secret.

  /network/provider-bandwidth-reserve:
    post:
      tags: [provider probing]
      summary: Reserve byte budget for one bandwidth probe
      description: |
        Take deployment-wide byte budget before spending any probe bytes.
        Active probing pulls real paid contract traffic through a provider's
        tunnel, so it is rationed per hourly bucket. `byte_count` is clamped
        to the per-probe maximum (16 MiB), so an oversized request cannot
        swallow a bucket.

        The prober measures over a tunnel it has open right now, so a
        reservation that lands in a LATER bucket is cancelled again and the
        request answered 429 with `Retry-After` pointing at the bucket that
        does have room; without that the hourly ceiling would be decorative.
      operationId: Provider Bandwidth Reserve
      security:
        - OperatorSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveProviderBandwidthArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveProviderBandwidthResult"
        "400":
          description: Missing client id, or a non-positive byte count.
        "401":
          description: Missing or wrong operator secret.
        "429":
          description: No budget in the current hourly bucket.
          headers:
            Retry-After:
              description: Seconds until the bucket that has room.
              schema:
                type: integer

  /network/provider-bandwidth-result:
    post:
      tags: [provider probing]
      summary: Submit an active bandwidth measurement
      description: |
        Store one active bandwidth measurement taken over a provider's tunnel.
        An active probe is a point measurement rather than a window, so the
        server stamps arrival time as both window bounds.

        The row is keyed on (client_id, source), so `source` must be one of
        the known ACTIVE values; an unrecognised tag would create a row
        nothing ever reads or replaces. `passive` is refused outright: that
        figure is derived server-side from bytes the provider was already paid
        to carry, which is what makes it ungameable, and accepting a submitted
        one would let this endpoint overwrite a derived figure with an
        asserted one. A non-positive rate or sample size is refused rather
        than allowed to overwrite a real measurement.
      operationId: Provider Bandwidth Result
      security:
        - OperatorSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProviderBandwidthArgs"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Missing client id, non-positive figures, or an unsubmittable source.
        "401":
          description: Missing or wrong operator secret.
        "413":
          description: The body is over 4 KiB.

  /network/provider-egress-health:
    post:
      tags: [provider probing]
      summary: Submit an egress-health run
      description: |
        Store one egress-health run: over the tunnel the geolocation probe
        already opened, how many of the sampled destinations each class
        reached. The row is an upsert keyed on client_id, so a bad submission
        does not sit beside the good one -- it destroys the last good
        measurement. Everything is therefore validated before anything is
        stored, and unknown fields are rejected outright (a misspelled field
        would decode to a perfectly consistent zero, filling the table with
        plausible rows describing a measurement that never happened).

        `class_results` must sum EXACTLY to `ok_count`/`total_count`: the
        classes are the score, and a total that does not decompose into them
        means the two halves came from different runs. Reputation is not
        health -- `reputation_ok`/`reputation_total` are stored beside the
        health figures and never inside them, and a `reputation` key inside
        `class_results` is refused, because nearly every honest hosted
        provider fails most of that class precisely by being hosted.
      operationId: Provider Egress Health Result
      security:
        - OperatorSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProviderEgressHealthArgs"
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
        "400":
          description: An unknown field, a negative or inconsistent count, or a `reputation` class.
        "401":
          description: Missing or wrong operator secret.
        "413":
          description: The body is over 16 KiB.

  /network/provider-verdict:
    post:
      tags: [provider probing]
      summary: Report that a provider carried nothing
      description: |
        A real client network reporting that a provider carried nothing. This
        is the ONE route in this group that is not operator-secret authed: the
        reporter is a network, and the network is the unit the quorum counts,
        so the reporting network is taken from the session jwt and never from
        the body. A met quorum only brings the provider's next probe forward.
        Unknown fields in the body are rejected.
      operationId: Provider Client Verdict Submit
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitProviderClientVerdictArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitProviderClientVerdictResult"
        "401":
          description: Missing or invalid bearer token.

  /network/prober-credential:
    get:
      tags: [provider probing]
      summary: The prober's own network client jwt
      description: |
        The network client jwt the bootstrap task minted for the operator's
        prober, so no human step remains between a fresh deployment and a
        probing prober.

        The response is narrow -- the jwt and the client id it names -- but do
        NOT read that as containment. The jwt itself carries `network_id`,
        `user_id` and `network_name` as readable claims, and holding it is
        enough to authenticate as the account and regenerate its seedphrase.
        The operator secret checked here is the actual gate.

        `404` means there is no credential YET (no prober row, or one whose
        client jwt has not been minted or was cleared for re-provisioning),
        which the prober must be able to tell from a failure -- so it is a 404
        rather than an empty 200.
      operationId: Prober Credential
      security:
        - OperatorSecret: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProberCredentialResult"
        "401":
          description: Missing or wrong operator secret, or the deployment has none configured.
        "404":
          description: No credential has been minted yet; keep polling.

  /network/geolocation-source-pins:
    get:
      tags: [provider probing]
      summary: Certificate pins for the geolocation source hosts
      description: |
        The certificate pins this server observed DIRECTLY for the geolocation
        source hosts, on its own network, with no provider in the path and
        full chain validation. The prober fetches them here instead of
        carrying a compile-time constant, and refuses to probe at all without
        a complete set: the geolocation lookup is issued THROUGH the provider
        under test, and the pin is what stops that provider substituting a
        certificate and forging its own location.

        The body is a BARE map from host to its pin, with no wrapping field.
        Both the leaf and its issuing intermediate SPKI hashes are served,
        because a match anywhere in the verified chain is accepted: the
        intermediate absorbs routine leaf renewal between observations, and
        the leaf is the tighter of the two while it lasts.

        A host that has never been observed is simply absent, and an empty
        table is `{}` with 200 rather than a 404 -- 404 would be
        indistinguishable from "this server does not implement the endpoint".
        This endpoint is read-only; nothing here ever accepts a pin from a
        request.
      operationId: Geolocation Source Pins
      security:
        - OperatorSecret: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeolocationSourcePinsResult"
        "401":
          description: Missing or wrong operator secret, or the deployment has none configured.

  /wallet/balance:
    get:
      description: |
        Get the balance for the USDC user custody wallet.
        The user custody wallet allows URnetwork to query the balance,
        but the user must take actions against the wallet.
      operationId: Wallet Balance
