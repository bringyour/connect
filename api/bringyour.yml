  /network/auth-client:
    post:
      tags: [onboarding]
      summary: Authenticate a client on the network
      description: |
        Gain permission to use the `connect` protocol as the requested clientId,
        or assign a new clientId.

        When the deployment enforces concurrent clients, a network is limited
        to 100 TOP-LEVEL clients (clients with no `source_client_id`, which are
        the network's peers); ancillary clients are not counted. Over the
        limit the call answers 200 with `error.upgrade_required` -- a plan
        limit, not a hard cap -- and an agent can settle it inline with the
        x402 round trip below.
      operationId: authNetworkClient
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthNetworkClientArgs"
      responses:
        "200":
          description: The client credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthNetworkClientResult"
        "401":
          description: Missing or invalid bearer token.

  /network/remove-client:
    post:
      description: |
        Remove a client from the network.
      operationId: Remove Network Client
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveNetworkClientArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveNetworkClientResult"

  /network/remove-clients:
    post:
      description: |
        Remove many clients from the caller's network in one call, so a
        network with hundreds of thousands of offline clients can be cleared
        without the caller chunking the request. Duplicate ids are collapsed;
        at most 1,000,000 ids per call (more is an error), and the body is
        capped at 100 MB.

        A small request (at most 10,000 ids) runs synchronously when the
        deployment's hourly bulk-removal budget has room right now, and the
        result is empty. Anything else is handed to a background task and the
        result says so: `scheduled` with `scheduled_for` naming the hourly
        bucket it was reserved against (the present moment when this hour had
        room, a future hour when it did not). The work is NOT complete when
        `scheduled` is true.

        Two refusals leave the ids unscheduled and ask the caller to retry:
        `already_in_progress` when this network already has a background run
        going, and `too_many_concurrent_runs` when the deployment-wide cap on
        concurrent runs is reached.
      operationId: Remove Network Clients
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoveNetworkClientsArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveNetworkClientsResult"

  /network/extender-activate:
    post:
      tags: [extenders]
      summary: Offer this client as an extender
      description: |
        Offer the calling client as an extender and, if it proves out, publish
        it in the directory (connect/EXTENDER.md C2).

        Requires a CLIENT jwt (from `/network/auth-client`): the activation is
        attributed to a network and a client, and is rate limited per user
        (6 per hour). Call it on the family api host of the family being
        activated -- `api-v4.bringyour.com` for an IPv4 address,
        `api-v6.bringyour.com` for an IPv6 one -- so the caller address the
        operator probes back has exactly one family. An operator without
        family hosts (a development operator on an ip literal, say) is
        activated through its plain api url instead, and the family of the
        outcome is the one the result reports. NEVER call it through an
        extender: the address that is probed and published is the address this
        request arrived from.

        Nothing is taken on the caller's word. Inside the request, and within
        a 10 second budget, the operator dials BACK to the caller's own
        address on every carrier offered and on every dns port listed, each
        time sending a challenge and verifying the response signature against
        `public_key_hex`; it then performs a verified `GET /hello` forward
        through the tcp carrier to its own api. The tcp carrier is therefore
        required, since only it can prove the forward. One dns port failing is
        not the dns carrier failing -- only a dns carrier with no port left is
        refused -- and the forward must arrive on the same family the probe
        reached, or the record would promise an address that does not carry
        the traffic.

        A refusal is a NORMAL 200 with `activated: false` and `error` naming
        the carrier that failed, not an HTTP error: the caller is a provider
        running this on a timer, and it needs to tell "this carrier did not
        answer" from "the request was malformed". Nothing is stored on a
        refusal.

        On success the extender row and the family's address row are upserted
        active and a record publish row is queued for gossip. The answer
        carries the extender's own freshly signed record and up to 8 signed
        records of other active extenders, which is the only bootstrap an app
        has before it has any peer.
      operationId: Extender Activate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtenderActivateArgs"
      responses:
        "200":
          description: |
            The activation outcome. A refused activation is a 200 with
            `activated: false` and `error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtenderActivateResult"
        "401":
          description: Missing or invalid client bearer token.

  /network/clients:
    get:
      description: |
        Get the latest status of the network's devices: every top-level
        client (no source_client_id) that is not a hosted proxy device, with
        no provide-mode qualification. Child clients are never listed, and
        neither are the network's cloud proxy devices (the "resident proxy"
        clients the proxy host runs), which `/network/proxies` lists instead.

        Includes:

        - Resident status, which is the platform counterpart
        for the client that handles control commands.
        - Connections, which are transports from the client to the platform.
        Note there can be multiple active connections for a single client.
        - Provide status

        `proxy_client` is never present on this list.
      operationId: Network Clients
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkClientsResult"

  /network/proxies:
    get:
      description: |
        The network's cloud proxy devices: the clients that carry a hosted
        proxy device (created with `proxy_config` on `/network/auth-client`),
        each with its `proxy_client` credentials (proxy URLs, auth token,
        WireGuard details). Same row shape as `/network/clients` otherwise:
        resident status, connections, provide status.
      operationId: Network Proxies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkClientsResult"

  /network/peers:
    get:
      description: |
        Fast network peer discovery.

        Lists the currently connected network peers: the top-level clients
        of the network (clients with no source_client_id) and their identity
        metadata (provide modes, principal, roles), plus disconnect markers
        for peers that disconnected within the recent window.

        Allowed for network sessions and top-level client sessions.
        A client session's own client is excluded from the list.
      operationId: Network Peers
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPeersResult"

