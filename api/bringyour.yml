                $ref: "#/components/schemas/NetworkBalanceCodesResult"

  /account/epochs:
    get:
      description: |
        The caller network's finalized epochs, newest first: the points earned
        inside each epoch's wall-clock window and the network's share of the
        operator pool in basis points (0 when no coldkey was attached, i.e.
        points only). `limit` defaults to 26 and is capped at 104.
      operationId: Account Epochs
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEpochsResult"

  /account/referral-code:
    get:
      description: |
        Unique network code to refer new users
      operationId: Account Referral Code
      security:
