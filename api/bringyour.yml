              schema:
                $ref: "#/components/schemas/VerifySeekerNftHolderResult"

  /account/balance-codes:
    get:
      description: |
        Fetch balance codes redeemed by network
      operationId: Account Balance Codes
      security:
        - BearerAuth: []
      responses:
