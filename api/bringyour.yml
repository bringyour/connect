  /referral-code/validate:
    post:
      description: |
        Validate a referral (bonus) code: whether it exists and whether it has
        been used up. The sign-up screens call this before an account exists,
        so no authentication is required; a bearer token, if sent, is ignored.
        Checks are budgeted per caller address (60 per 10 minutes) and across
        all callers; over budget the response is 429 with a Retry-After header.
      operationId: Validate Referral Code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateReferralCodeArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateReferralCodeResult"
        "429":
          description: Too many referral code checks from this address; retry after the Retry-After seconds.

  /account/referral-network:
