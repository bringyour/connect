      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetClientKeyResult"

  /hello:
    get:
      tags: [extenders]
      summary: Discovery
      description: |
        Simple hello to the network that returns some useful information.
        This can be used for discovery.

        It is also the extender network's trust root: `extender_root_public_keys`
        are the keys whose record signatures this network space accepts, and
        `gossip_peer_id` names the operator's gossip node. Both arrive over the
        platform's pinned tls, so a client can refresh them even when the
        request itself travelled through an untrusted extender -- and the
        extender activation probe forwards a real `GET /hello` through the
        candidate's tcp carrier to prove the forward works.
      operationId: Hello
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelloResult"

  /my-ip-info:
    get:
      description: |
        Information about the caller's IP as seen by the platform:
        geolocation, privacy/VPN classification, whether the IP is currently
        connected to the network, and expected round-trip times to nearby
        landmarks.

        `landmarks` is served by the separate whereami service in front of this
        route, not by the api handler, so a request answered by the api alone
        carries `info` and `connected_to_network` only.
      operationId: My IP Info
      security: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyIPInfoResult"

  /account/change-name:
    post:
      description: |
        Change the network name of the calling network. The previous name
        enters a reclaim cooldown. Subject to the account action rate limit.
      operationId: Account Change Name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeNetworkNameArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeNetworkNameResult"

  /account/claim-name:
    post:
      description: |
        Claim an unused network name for the calling network. Claiming and
        changing have SEPARATE daily budgets: a first-time claim does not
        consume any of the rename budget, and vice versa. Renaming a name that
        is still inside its reclaim cooldown is charged to the change-name
        budget instead.
      operationId: Account Claim Name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeNetworkNameArgs"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeNetworkNameResult"

  /account/api-key:
