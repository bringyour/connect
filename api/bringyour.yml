        Please use this before initiating any transfer out to avoid lost funds.
      operationId: Wallet Validate Address
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletValidateAddressArgs"
      responses:
        "200":
          description: OK.
