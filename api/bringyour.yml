    CompetitionScoreSignificance:
      type: object
      description: |
        The immutable statistical record of one evaluation. Percent fields use
        100 for one hundred percent; variances are sample variances.
      properties:
        method:
          type: string
        alpha:
          type: number
        replicate_count:
          type: integer
        baseline_mean_raw_score:
          type: number
        candidate_mean_raw_score:
          type: number
        baseline_sample_variance:
          type: number
        candidate_sample_variance:
          type: number
        observed_improvement_percent:
          type: number
        takeover_margin_percent:
          type: number
        minimum_significant_improvement_percent:
          type: number
        required_improvement_percent:
          type: number
        one_sided_p_value:
          type: number
        welch_t:
          type: number
        welch_degrees_of_freedom:
          type: number
        statistically_significant:
          type: boolean
        next_epoch_minimum_improvement_percent:
          type: number
        recommended_next_epoch_takeover_margin_percent:
          type: number
        recommended_next_epoch_takeover_margin_supported:
          type: boolean

    CompetitionScoreResult:
      type: object
      properties:
        score_schema:
          type: integer
        raw_score:
          type: number
        normalized_score:
          type: number
        placeable:
          type: boolean
        takeover_eligible:
          type: boolean
        gates:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CompetitionGate"
        significance:
          $ref: "#/components/schemas/CompetitionScoreSignificance"
        diagnostics:
          type: object

    CompetitionLeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        job_id:
          description: udid
          type: string
        patch_sha256:
          type: string
        submitted_at:
          type: string
          format: date-time
        winner:
          type: boolean
        honesty_review:
          type: string
        score:
          $ref: "#/components/schemas/CompetitionScoreResult"
        submitter_count:
          type: integer

    CompetitionLeaderboardResult:
      type: object
      properties:
        competition_id:
          type: string
        round_id:
          description: udid
          type: string
        epoch:
          type: integer
        staging:
          type: boolean
        status:
          type: string
        finalized_at:
          type: string
          format: date-time
        winner_job_id:
          description: udid; null when the epoch has no winner.
          type: [string, "null"]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardEntry"

    CompetitionSeasonLeaderboardResult:
      type: object
      properties:
        competition_id:
          type: string
        epochs:
          type: array
          items:
            $ref: "#/components/schemas/CompetitionLeaderboardResult"

    CompetitionScoreArgs:
      type: object
      properties:
        round_id:
          description: udid
          type: string
        patch:
          description: The patch, validated and canonicalized against the published patch policy.
          type: string

    CompetitionScoreAcceptedResult:
      type: object
      properties:
        job_id:
          description: udid
          type: string
        round_id:
          description: udid
          type: string
        staging:
          type: boolean
        patch_sha256:
          type: string
        state:
          type: string
        cache_hit:
          description: An identical canonical patch had already been evaluated.
          type: boolean
        status_url:
          description: The path to poll, `/competition/score/<job_id>`.
          type: string

    CompetitionScoreJobResult:
      type: object
      properties:
        job_id:
          description: udid
          type: string
        round_id:
          description: udid
          type: string
        staging:
          type: boolean
        patch_sha256:
          type: string
        state:
          type: string
        submitted_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        cache_key:
          type: string
        evaluator_image_digest:
          type: string
        api_image_digest:
          type: string
        worker_image_digest:
          type: string
        score:
          description: Present once the round publishes.
          $ref: "#/components/schemas/CompetitionScoreResult"
        eval_error:
          $ref: "#/components/schemas/CompetitionError"

    # ----- providers map -----

    RegionProviders:
      type: object
      description: One region's provider and extender counts, and the point to draw them at.
      required:
        - provider_count
        - extender_count
        - lat
        - lon
      properties:
        provider_count:
          description: Public providers in the region; 0 for a region that has only extenders.
          type: integer
        extender_count:
          description: |
            Online extenders in the region; 0 for a region that has only
            providers. Always present -- a region without the field at all is
            an old blob, which is not the same thing as a present zero.
          type: integer
        lat:
          description: wgs84 latitude of the region centroid (the country centroid as a fallback).
          type: number
        lon:
          description: wgs84 longitude.
          type: number

    ProvidersMapResult:
      type: object
      description: |
        `country code -> region name -> RegionProviders`. The country code is
        the lowercase ISO 3166-1 alpha-2 code as the location table stores it.
      additionalProperties:
        x-additionalPropertiesName: country code
        type: object
        additionalProperties:
          x-additionalPropertiesName: region name
          $ref: "#/components/schemas/RegionProviders"

    AuthWalletNonceResult:
      type: object
      properties:
        nonce:
          description: Single-use, expires in 5 minutes. Embed it in the signed message and echo it as `wallet_auth.wallet_nonce`.
          type: string

    RemoveNetworkClientsArgs:
      type: object
      properties:
        client_ids:
          description: udids. Duplicates are collapsed; at most 1,000,000 per call.
          type: array
          items:
            type: string

    RemoveNetworkClientsResult:
      type: object
      description: |
        Empty when the removal ran synchronously. Otherwise exactly one of the
        three flags below says what happened.
      properties:
        scheduled:
          description: Handed off to the background task; deactivation is NOT complete yet.
          type: boolean
        scheduled_for:
          description: |
            The start of the hourly bucket the request was reserved against;
            present whenever `scheduled` is true. Now (or a moment before)
            when this hour had room, a future time when it did not.
          type: string
          format: date-time
        already_in_progress:
          description: This network already has a background run going; the ids were NOT scheduled.
          type: boolean
        too_many_concurrent_runs:
          description: The deployment-wide cap on concurrent runs was reached; the ids were NOT scheduled.
          type: boolean

    # ----- extenders -----

    ExtenderActivateArgs:
      type: object
      properties:
        public_key_hex:
          description: |
            The extender's identity public key, hex. Every probe requires a
            signature over a fresh challenge under this key.
          type: string
        tcp_port:
          description: The tcp carrier port. 0 takes the default, 443.
          type: integer
        udp_port:
          description: The quic carrier port. 0 takes the default, 443.
          type: integer
        dns_port:
          description: |
            The extender's configured dns port, which is what a reader that
            predates `dns_ports` dials. 0 takes the default whodis port.
          type: integer
        dns_ports:
          description: |
            Every dns port the caller is listening on, each probed on its own.
            Empty offers `dns_port` alone. One port failing does not fail the
            dns carrier; only a carrier with no port left is refused.
          type: array
          items:
            type: integer
        dns_tld:
          description: The dns carrier's tld. Empty takes the default; at most 128 characters.
          type: string
        carriers:
          description: |
            The carriers offered, lower-cased and de-duplicated: `tcp`, `quic`
            and `dns`. At least one is required, and `tcp` is always required
            because only it can prove the forward. An unknown carrier is
            refused.
          type: array
          items:
            type: string
            enum: [tcp, quic, dns]

    ExtenderActivateResult:
      type: object
      description: |
        A refusal is a normal 200 with `activated: false` and `error`; nothing
        is stored.
      properties:
        activated:
          type: boolean
        ip:
          description: The caller address that was probed and published.
          type: string
        ip_version:
          description: 4 or 6. The forward must arrive on this same family.
          type: integer
        carriers:
          description: The carriers that passed their probe, which is what the stored address and the signed record list.
          type: array
          items:
            type: string
        dns_ports:
          description: |
            The dns ports that passed their probe, ascending, which is what
            the stored address and the signed record list. Empty when the dns
            carrier was not offered.
          type: array
          items:
            type: integer
        error:
          description: |
            Why the activation was refused; empty on success. A refusal is a
            normal answer, not a request error: the caller is told which
            carrier failed so it can fix its own binding.
          type: string
        expire_time:
          description: When the signed record expires (14 days from issue).
          type: string
          format: date-time
        allowed_hosts:
          description: The operator host patterns this extender may forward to.
          type: array
          items:
            type: string
        record:
          description: base64 of the extender's own serialized `protocol.ExtenderRecord`.
          type: string
        bootstrap:
          description: |
            base64 serialized `protocol.ExtenderRecord` messages of up to 8
            other active extenders, chosen at random -- the directory an app
            starts from before it has any peer.
          type: array
          items:
            type: string

    # ----- provider probing -----

    ProviderClientIdsResult:
      type: object
      properties:
        client_ids:
          type: array
          items:
            description: udid
            type: string

    SubmitProviderEgressLocationArgs:
      type: object
      properties:
        client_id:
          description: udid
          type: string
        country_code:
          type: string
        country:
          type: string
        region:
          type: string
        city:
          type: string
        asn:
          type: integer
        org:
          type: string
        hosting:
          type: boolean
        proxy:
          type: boolean
        mobile:
          type: boolean
        country_confident:
          type: boolean
        city_confident:
          type: boolean
        observed_at:
          type: string
          format: date-time

    SubmitProviderEgressLocationResult:
      type: object
      properties:
        location_id:
          description: udid
          type: string

    RecordProviderEgressProbeAttemptArgs:
      type: object
      properties:
        client_id:
          description: udid
          type: string
        probe_failure:
          description: |
            Empty when the attempt succeeded, otherwise a short failure class
            (`contract_failed`, `tunnel_failed`, `no_consensus`, ...).
          type: string

    RecordProviderEgressProbeAttemptResult:
      type: object
      properties:
        attempt_at:
          type: string
          format: date-time

    SubmitProviderBlackholeCheckArgs:
      type: object
      description: One provider's blackhole result, kept to the one question the check answers.
      properties:
        client_id:
          description: udid
          type: string
        ok:
          description: Something got through.
          type: boolean
        failure:
          description: |
            A short failure class when `ok` is false (`tunnel_failed`,
            `all_destinations_failed`, ...), at most 64 characters. Required
            when `ok` is false; ignored when it is true.
          type: string
        checked_at:
          description: Required, never fabricated server-side, and never in the future.
          type: string
          format: date-time

    SubmitProviderBlackholeChecksArgs:
      type: object
      properties:
        checks:
          description: 1 to 10,000 results. The whole batch is validated before any of it is written.
          type: array
          items:
            $ref: "#/components/schemas/SubmitProviderBlackholeCheckArgs"

    SubmitProviderBandwidthArgs:
      type: object
      properties:
        client_id:
          description: udid
          type: string
        source:
          description: |
            Which target produced this figure. Part of the storage key, which
            is what keeps the two targets' figures in separate rows. `passive`
            is refused: it is derived server-side and must never be asserted.
          type: string
          enum: [active-operator, active-cdn]
        bytes_per_second:
          description: Must be positive.
          type: number
        sample_byte_count:
          description: Must be positive.
          type: integer

    ReserveProviderBandwidthArgs:
      type: object
      properties:
        client_id:
          description: udid
          type: string
        byte_count:
          description: Must be positive; clamped to the per-probe maximum (16 MiB).
          type: integer

    ReserveProviderBandwidthResult:
      type: object
      properties:
        reservation_id:
          description: udid
          type: string
        bucket_start:
          description: The hourly bucket the reservation was taken in, always the current one.
          type: string
          format: date-time

    ProviderEgressHealthClassResult:
      type: object
      description: One class's tally over the destinations the run sampled.
      properties:
        ok:
          type: integer
        total:
          type: integer

    SubmitProviderEgressHealthArgs:
      type: object
      description: |
        One egress-health run. There is deliberately no measured_at: the
        server stamps arrival time. Unknown fields are rejected.
      properties:
        client_id:
          description: udid
          type: string
        ok_count:
          description: The SCORED classes only. Reputation is never part of this.
          type: integer
        total_count:
          type: integer
        class_results:
          description: |
            The per-class tally for the scored classes. Its `ok` and `total`
            must sum to exactly `ok_count` and `total_count`. A `reputation`
            key is refused.
          type: object
          additionalProperties:
            x-additionalPropertiesName: class
            $ref: "#/components/schemas/ProviderEgressHealthClassResult"
        reputation_ok:
          description: Stored beside the health figures and never inside them.
          type: integer
        reputation_total:
          type: integer
        failed_names:
          description: The joined names of the scored destinations that failed.
          type: string
        reputation_failed_names:
          type: string
        tls_authentication_failure:
          description: |
            Separate from the score. A peer that cannot authenticate the
            requested HTTPS host is a hard integrity failure even when the
            counts look healthy.
          type: boolean

    SubmitProviderClientVerdictArgs:
      type: object
      description: |
        The reporting network comes from the session jwt and is never in the
        body. Unknown fields are rejected.
      properties:
        exit_client_id:
          description: udid. The provider being reported.
          type: string
        reason:
          type: string
        send_ack_count:
          type: integer
        send_ack_bytes:
          type: integer
        receive_ack_count:
          type: integer
        receive_ack_bytes:
          type: integer
        syn_sent:
          type: integer
        syn_received:
          type: integer
        window_seconds:
          type: integer

    SubmitProviderClientVerdictResult:
      type: object
      properties: {}

    ProberCredentialResult:
      type: object
      properties:
        by_client_jwt:
          description: |
            The prober's network client jwt. Revocable and re-mintable, but
            holding it authenticates as the prober's account.
          type: string
        client_id:
          description: udid. The client the jwt already names.
          type: string

    GeolocationSourcePin:
      type: object
      description: |
        One host's observed certificate pin: the base64 sha-256 SPKI hash of
        the leaf certificate and of its issuing intermediate, exactly as this
        server recorded them from a direct, WebPKI-validated connection. A
        match anywhere in the verified chain is accepted.
      properties:
        leaf:
          type: string
        intermediate:
          type: string

    GeolocationSourcePinsResult:
      type: object
      description: |
        A bare map from geolocation source host to its pin, with no wrapping
        field. A host that has never been observed is absent; an empty table
        is `{}`.
      additionalProperties:
        x-additionalPropertiesName: host
        $ref: "#/components/schemas/GeolocationSourcePin"

    # ----- store purchase verification -----

    VerifyPlayPurchaseArgs:
      type: object
      properties:
        package_name:
          description: Defaults to, and must match, this app's package.
          type: string
        product_id:
          description: |
            The sku the client believes it bought. When set it must name one
            of the token's line items; the credited sku is always the store's.
          type: string
        purchase_token:
          type: string

    VerifyAppleTransactionArgs:
      type: object
      properties:
        signed_transaction:
          description: The StoreKit transaction JWS (`Transaction.jwsRepresentation`).
          type: string

    VerifyStorePurchaseResult:
      type: object
      properties:
        status:
          description: |
            `credited`, `already_credited`, `wrong_network` and `invalid` are
            terminal -- stop retrying and finalize with the store. `pending`
            is retryable.
          type: string
          enum: [credited, already_credited, pending, invalid, wrong_network]
        expiry_time:
          description: The credited window's end, when the store reported one.
          type: string
          format: date-time

    # ----- x402 -----

    X402Sku:
      type: object
      properties:
        sku_id:
          type: string
        description:
          type: string
        price_usd:
          type: number
        pro:
          description: True for the Pro-month sku, which grants the Pro entitlement. The data skus never do.
          type: boolean
        byte_count:
          type: integer

    X402SkusResult:
      type: object
      properties:
        x402_version:
          type: integer
        networks:
          type: array
          items:
            type: string
        asset:
          type: string
        skus:
          type: array
          items:
            $ref: "#/components/schemas/X402Sku"

    X402Accept:
      type: object
      description: One set of payment terms the agent may satisfy.
      properties:
        scheme:
          type: string
        network:
          type: string
        maxAmountRequired:
          type: string
        resource:
          type: string
        description:
          type: string
        mimeType:
          type: string
        payTo:
          type: string
        asset:
          type: string
        maxTimeoutSeconds:
          type: integer

    X402PaymentRequired:
      type: object
      description: The body of a 402 response.
      properties:
        x402Version:
          type: integer
        error:
          type: string
        accepts:
          type: array
          items:
            $ref: "#/components/schemas/X402Accept"

    X402PurchaseArgs:
      type: object
      required: [sku_id]
      properties:
        sku_id:
          type: string
        network:
          description: The network the agent intends to pay on. Must be one that was quoted. Optional when only one is configured.
          type: string
        email:
          description: Where to send the receipt. Optional.
          type: string

    X402PurchaseResult:
      type: object
      properties:
        complete:
          type: boolean
        sku_id:
          type: string
        pro:
          type: boolean
        byte_count:
          type: integer
        transaction:
          type: string
        network:
          type: string

    # ----- store and processor notifications -----

    StripeWebhookArgs:
      type: object
      description: Only the fields the server reads; Stripe sends a much larger event.
      properties:
        id:
          type: string
        type:
          type: string
        data:
          type: object
          properties:
            object:
              description: The event's object, whose shape depends on `type`.
              type: object

    StripeWebhookResult:
      type: object
      properties:
        message:
          description: Set only when the event was not acted on.
          type: object
          properties:
            message:
              type: string

    CoinbaseWebhookArgs:
      type: object
      description: Only the fields the server reads; Coinbase sends more.
      properties:
        event:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            data:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                description:
                  type: string
                payments:
                  type: array
                  items:
                    type: object
                checkout:
                  type: object
                metadata:
                  type: object

    CoinbaseWebhookResult:
      type: object
      properties: {}

    PlayWebhookArgs:
      type: object
      description: The Pub/Sub push envelope. The notification itself is base64 in `message.data`.
      properties:
        message:
          type: object
          properties:
            data:
              description: base64 of the Play developer notification JSON.
              type: string

    PlayWebhookResult:
      type: object
      properties:
        Message:
          description: |
            Present only when the notification was not acted on. The field is
            capitalized on the wire, because the Go field carries no json tag.
          type: object
          properties:
            message:
              type: string

    HeliusWebhookResult:
      type: object
      properties:
        message:
          description: Set only when the transfer was not credited.
          type: string

    CircleChallengeNotification:
      type: object
      description: |
        A Circle notification envelope carrying a challenge event. Only a
        `challenges.initialize` notification whose event is a completed
        `INITIALIZE` is acted on.
      properties:
        subscriptionId:
          type: string
        notificationId:
          type: string
        notificationType:
          type: string
        notification:
          type: object
          properties:
            id:
              type: string
            userId:
              type: string
            status:
              type: string
            correlationIds:
              description: The first entry names the network the wallet belongs to.
              type: array
              items:
                type: string
            errorCode:
              type: integer
            type:
              type: string
        timestamp:
          type: string
          format: date-time
        version:
          type: integer

    CircleWalletWebhookResult:
      type: object
      properties: {}

    AppleNotificationPayload:
      type: object
      description: |
        The App Store Server Notification V2 envelope. Exactly this one field
        is accepted; an unknown field is a 400.
      required: [signedPayload]
      properties:
        signedPayload:
          description: The compact JWS of the notification.
          type: string

    # ----- public verification indexes -----

    PublicVerifyStatsRow:
      type: object
      properties:
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        client_id:
          description: uuid
          type: string
        assignments:
          type: integer
        confirmations:
          type: integer
        reliability_ppm:
          description: Confirmations per million assignments.
          type: integer
        latency_p50_ms:
          type: integer
        latency_p90_ms:
          type: integer
        latency_p99_ms:
          type: integer

    GetVerifyStatsResult:
      type: object
      properties:
        schema:
          type: string
        profile:
          type: string
        policy_hash:
          type: string
        egress_hash_key_id:
          description: The id only; the key itself never leaves the server.
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PublicVerifyStatsRow"

    PublicVerifyProofRow:
      type: object
      properties:
        trail_id:
          description: uuid
          type: string
        vpk:
          description: base64 encoded 32-byte Ed25519 validator path key.
          type: string
        server_key_id:
          description: 1-byte id of the server key that signed final_sig. See /verify/keys.
          type: integer
        server_nonce:
          description: base64 encoded 32-byte per-trail server nonce.
          type: string
        depth:
          type: integer
        status:
          type: integer
        hops:
          description: The trail's hops, as stored.
          type: array
          items:
            type: object
        final_sig:
          description: base64 encoded 64-byte Ed25519 FINAL signature by the server.
          type: string
        verifier_sig:
          description: base64 encoded 64-byte Ed25519 depth-M EXTEND signature by the validator.
          type: string
        create_time:
          type: string
          format: date-time
        complete_time:
          type: string
          format: date-time

    GetVerifyProofsResult:
      type: object
      properties:
        schema:
          type: string
        profile:
          type: string
        policy_hash:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PublicVerifyProofRow"

    # ----- subnet artifacts, evidence and client-key history -----

    SnArtifactHistoryObject:
      type: object
      properties:
        key:
          type: string
        size:
          type: integer
        content_hash:
          description: '`sha256:` followed by the lowercase 64-character hex hash.'
          type: string

    SnArtifactHistoryResult:
      type: object
      properties:
        schema:
          description: Always `urnetwork-payout-artifact-history-v1`.
          type: string
        objects:
          type: array
          items:
            $ref: "#/components/schemas/SnArtifactHistoryObject"
        more:
          type: boolean
        next_after:
          description: The cursor for the next page; empty on the last page.
          type: string

    SnEvidenceEnvelope:
      type: object
      description: |
        A signed release-evidence envelope. The signature is what authorizes a
        publication; there is no separate credential.
      properties:
        schema:
          type: string
        deployment_id:
          type: string
        chain_id:
          type: integer
        genesis_hash:
          description: 0x-hex.
          type: string
        netuid:
          type: integer
        kind:
          type: string
        run_id:
          type: string
        created_at:
          type: string
        payload:
          description: The evidence payload; its shape depends on `kind`.
          type: object
        signer:
          description: 0x-hex EVM address of the signing operator artifact key.
          type: string
        content_hash:
          description: '`sha256:` followed by the lowercase hex hash of the canonical bytes.'
          type: string
        signature:
          type: string

    SnPublishedEvidenceResult:
      type: object
      properties:
        content_hash:
          type: string
        content_key:
          description: The immutable object key the envelope was published at.
          type: string
        history_key:
          description: The key under the run's history prefix.
          type: string
        bucket:
          type: string

    SnEvidenceHistoryObject:
      type: object
      description: |
        The fields are Capitalized on the wire: this is Go's
        `server.BlobObject`, which carries no json tags. The artifact history
        at `/sn/artifacts` uses lower-case names instead.
      properties:
        Key:
          type: string
        Size:
          type: integer

    SnEvidenceHistoryResult:
      type: object
      properties:
        schema:
          description: Always `urnetwork-release-evidence-history-v1`.
          type: string
        objects:
          type: array
          items:
            $ref: "#/components/schemas/SnEvidenceHistoryObject"
        more:
          type: boolean
        next_after:
          description: The cursor for the next page; empty on the last page.
          type: string

    SnClientKeyObservationArgs:
      type: object
      description: |
        The body must be exactly the canonical encoding of these two fields --
        no unknown fields, no trailing JSON, no re-ordering.
      properties:
        client_id:
          description: uuid. The client whose key history is being observed.
          type: string
        request:
          description: |
            base64 of the encoded signed observation request, at most 8 KiB.
            The request cannot supply a key to sign.
          type: string

    ClientKeyEffectiveBoundary:
      type: object
      properties:
        epoch:
          type: integer
        block:
          type: integer
        hash:
          description: A 32-byte hash, on the wire as a JSON array of 32 integers (a Go [32]byte).
          type: array
          items:
            type: integer

    ClientKeyObservationRequest:
      type: object
      properties:
        client_id:
          description: A 16-byte client id, on the wire as a JSON array of 16 integers.
          type: array
          items:
            type: integer
        validator_hotkey:
          description: A 32-byte hotkey, on the wire as a JSON array of 32 integers.
          type: array
          items:
            type: integer
        native_block:
          type: integer
        native_hash:
          description: A 32-byte hash, on the wire as a JSON array of 32 integers.
          type: array
          items:
            type: integer
        native_epoch:
          type: integer
        decision_boundary:
          $ref: "#/components/schemas/ClientKeyEffectiveBoundary"
        nonce:
          description: A 32-byte nonce, on the wire as a JSON array of 32 integers.
          type: array
          items:
            type: integer

    ClientKeyObservationBatchRequest:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: "#/components/schemas/ClientKeyObservationRequest"
        maximum_response_bytes:
          type: integer

    ClientKeyHistoryResponse:
      type: object
      properties:
        history:
          description: The client's signed key history statements, base64 encoded, oldest first.
          type: array
          items:
            type: string
        observation:
          description: base64 of the signed observation this call published.
          type: string

    ClientKeyObservationBatchResponse:
      type: object
      properties:
        responses:
          description: One encoded ClientKeyHistoryResponse per request, in request order.
          type: array
          items:
            $ref: "#/components/schemas/ClientKeyHistoryResponse"

    # ----- onboarding email tracker -----

    OnboardingEmailTrackerRow:
      type: object
      description: |
        One send day and dimension tuple. Every count is DISTINCT NETWORKS,
        never events.
      properties:
        send_day:
          type: string
          format: date
        step:
          type: string
        template:
          type: string
        variant:
          type: string
        experiment:
          type: string
        experiment_variant:
          type: string
        platform:
          type: string
        path:
          type: string
        sent:
          type: integer
        delivered:
          type: integer
        opened:
          type: integer
        clicked:
          type: integer
        landing_clicked:
          type: integer
        app_opened:
          type: integer
        connected:
          type: integer
        widget_added:
          type: integer
        feedback_submitted:
          type: integer
        pro_started:
          type: integer
        engaged:
          description: The union of the engagement events named in `definitions.engaged_includes`.
          type: integer
        bounced:
          type: integer
        unsubscribed:
          type: integer
        complained:
          type: integer
        attribution_ambiguous:
          description: Events attributable only to a template shared by more than one flow step.
          type: integer
        computed_at:
          type: string
          format: date-time

    OnboardingEmailTrackerDefinitions:
      type: object
      description: The rules the page was computed under, returned with the data.
      properties:
        counts:
          type: string
        dashboard_window_days:
          type: integer
        engagement_window_days:
          type: integer
        delivery_correction_days:
          type: integer
        engaged_includes:
          type: array
          items:
            type: string
        engaged_excludes:
          type: array
          items:
            type: string
        legacy_attribution:
          type: string

    OnboardingEmailTrackerPage:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingEmailTrackerRow"
        next_cursor:
          description: The cursor for the next page; null on the last page.
          type: [string, "null"]
        min_networks:
          description: The volume floor applied to this page.
          type: integer
        definitions:
          $ref: "#/components/schemas/OnboardingEmailTrackerDefinitions"

    # ----- oauth authorization server -----

    AuthorizationServerMetadata:
      type: object
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        registration_endpoint:
          type: string
        revocation_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        claims_supported:
          type: array
          items:
            type: string
        client_id_metadata_document_supported:
          type: boolean
        authorization_response_iss_parameter_supported:
          type: boolean
        resource_indicators_supported:
          description: rfc 8707.
          type: boolean

    Jwk:
      type: object
      properties:
        kty:
          type: string
        crv:
          type: string
        kid:
          type: string
        alg:
          type: string
        use:
          type: string
        x:
          type: string
        "y":
          type: string

    JwkSet:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"

    OauthTokenResponse:
      type: object
      properties:
