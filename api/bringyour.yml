        next_cursor:
          description: Pages forward from this page's last row; absent on the last page
          type: string
        prev_cursor:
          description: |
            Pages backward from this page's first row; ABSENT (the key is
            omitted, never null) when the page starts at position 1. Present
            on every page reached by a cursor or a `seek_rank`.
          type: string
        restart:
          description: The cursor's snapshot is gone; reload from the top
          type: boolean
        total_ranked:
          description: Networks ranked in the snapshot; every one of them is listed across the pages
          type: integer
          format: int64
        snapshot_time:
          type: string
          format: date-time
        latest_epoch:
          description: The latest finalized epoch the snapshot counts
          type: integer
          format: int64
        epoch_metrics_available:
          description: |
            Whether the snapshot has finalized epoch metrics. When false the
            `blocks` and `streak` sorts are refused with an error, so a client
            should not offer them.
          type: boolean
        me:
          $ref: "#/components/schemas/PointsLeaderboardMe"
        error:
          type: object
          properties:
            message:
              type: string

