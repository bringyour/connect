      type: object
      properties:
        network_id:
          type: string
        network_name:
          description: Present only when the network turned on points_leaderboard_public (/network/points-ranking-visibility)
          type: string
        emoji_tag:
          description: The network's emoji tag, absent when unset; shown whether or not the name is
          type: string
        anonymous:
          description: true when the network name is hidden; the row is listed either way
          type: boolean
        contains_profanity:
          description: The public name contains profanity (apps may mask it)
          type: boolean
        total_points:
          description: All-time points
          type: number
          format: double
        blocks_with_points:
          description: Finalized epochs in which the network earned points
          type: integer
        streak:
          description: Consecutive finalized epochs with points ending at the latest finalized epoch
          type: integer
        longest_streak:
          description: The best streak ever (informational, never ranked)
          type: integer
        rank_points:
          type: integer
          format: int64
        rank_blocks:
          type: integer
          format: int64
        rank_streak:
          type: integer
          format: int64
        position:
          description: |
            The row's 1-based place in the requested sort's total order.
            Ranks tie (competition ranks), positions never do: this is the
            `seek_rank` coordinate and the key a client keeps its loaded
            window by.
          type: integer
          format: int64
          minimum: 1

    PointsLeaderboardMe:
      allOf:
        - $ref: "#/components/schemas/PointsLeaderboardRow"
