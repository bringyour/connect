      type: object
      properties:
        item_id:
          type: string
        storefront_country:
          type: string
          description: |
            ISO 3166-1 storefront country, when the caller knows it. The Pro
            items are priced at the caller's regional tier and, when the
            welcome offer is redeemable (yearly only), the 25% coupon is
            applied server-side; the charged tier is finalized from the
            card's billing country once attached.
        ui_mode:
          type: string
          description: |
            "hosted" (default) or "embedded".
          enum:
            - hosted
            - embedded
        redirect_on_completion:
          type: string
          description: |
            "never" keeps an EMBEDDED checkout fully inline: Stripe fires the
            client's onComplete callback instead of redirecting, so the page
            the customer is on never navigates. Only valid with `ui_mode`
            "embedded". Empty means the embedded flow redirects to the
            configured return url, and hosted behaves as always.

