        api_port:
          type: integer
        http_proxy_url:
          type: string
        https_proxy_url:
          type: string
        socks_proxy_url:
          type: string
        auth_token:
          type: string
        instance_id:
          description: udid. The instance_id of the proxy device.
          type: string
        proxy_host:
          type: string
        socks_proxy_port:
          type: integer
        http_proxy_port:
          type: integer
        https_proxy_port:
          type: integer
        wg_config:
          type: object
          properties:
            wg_proxy_port:
              type: integer
            client_private_key:
              type: string
            client_public_key:
              type: string
            client_ipv4:
