          type: string
        network_id:
          type: string
        network_name:
          type: string
        principal:
          type: string

    OauthConsentRequest:
      type: object
      description: The authorization request, as the consent page passes it through.
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
        response_type:
          description: Defaults to `code`.
          type: string
        scope:
          type: string
        state:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          description: Defaults to `S256`.
          type: string
        resource:
          description: rfc 8707 resource indicator.
          type: string
        nonce:
          type: string
        prompt:
          description: '`consent` forces the screen even when the scopes are already approved.'
