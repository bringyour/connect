  /auth/apple/callback:
    post:
      tags: [auth]
      summary: Sign in with Apple return for android, windows and linux
      operationId: authAppleCallback
      description: |
        Apple has no SDK for android, windows or linux, so those apps open
        Apple's authorize page in the system browser (a Custom Tab on android)
        with `client_id` = the Apple Services ID, `redirect_uri` = this
        endpoint, `response_type=code id_token`, `response_mode=form_post`,
        `scope=name email`, and a fresh `state` and `nonce` per attempt. Apple
        posts the result here as a form, and this endpoint answers `302` to the
        app's own scheme so the browser hands control back to the app:

            <scheme>://oauth/apple?state=…&id_token=…&code=…&user=…
            <scheme>://oauth/apple?state=…&error=…

        `user` is the JSON name/email Apple sends with the first authorization
        only. Nothing is stored or verified here: the app checks that `state`
        is the attempt it started and that the identity token's `nonce` claim
        is the one it minted, then signs in with the token through
        `POST /auth/login` (`auth_jwt_type: apple`), which verifies the
        signature and the audience.

        `state` is opaque except for one optional claim: when it is the
        base64url encoding of a JSON object with a `platform` key, that key
        picks the scheme (`android` → `ur://`, `windows` and `linux` →
        `urnetwork://`); without it the android scheme is used. `GET` with the
        same parameters as a query behaves the same way (manual testing).
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  description: The attempt's state, echoed by Apple untouched.
                code:
                  type: string
                  description: Apple's authorization code (unused by the apps, passed through).
                id_token:
                  type: string
                  description: Apple's identity token (a JWT carrying the attempt's nonce).
                user:
                  type: string
                  description: JSON with the user's name and email, first authorization only.
                error:
                  type: string
                  description: Apple's error, e.g. `user_cancelled_authorize`.
      responses:
        '302':
          description: Redirect to the app's `<scheme>://oauth/apple?…` return url.
          headers:
            Location:
              schema:
                type: string
              example: 'ur://oauth/apple?state=eyJwbGF0Zm9ybSI6ImFuZHJvaWQiLCJ0b2tlbiI6IjEyMyJ9&id_token=eyJ...'
        '400':
          description: No `state` in the form, or a body over 64 KiB.
    get:
      tags: [auth]
      summary: Sign in with Apple return (query form, for manual testing)
      operationId: authAppleCallbackGet
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: id_token
          schema:
            type: string
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: user
          schema:
            type: string
        - in: query
          name: error
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the app's `<scheme>://oauth/apple?…` return url.
        '400':
          description: No `state`.
  /auth/google/callback:
    get:
      tags: [auth]
      summary: Sign in with Google return for windows and linux
      operationId: authGoogleCallback
      description: |
        Windows and Linux have no native Google sign-in, so those apps open
        Google's authorize page in the system browser with `client_id` = the
        ur.io web sign-in client, `redirect_uri` = this endpoint,
        `response_type=code`, `scope=openid email profile`,
        `prompt=select_account`, and a fresh `state` and `nonce` per attempt
        (android signs in with play services and ur.io in the page; neither
        uses this). Google redirects the browser here with the authorization
        code; this endpoint exchanges it at Google's token endpoint with the
        web client's secret (vault `google.yml` `sign_in_oauth`) and answers
        `302` to the app's own scheme so the browser hands control back to
        the app:

            <scheme>://oauth/google?state=…&id_token=…
            <scheme>://oauth/google?state=…&error=…

        Nothing is stored. The app checks that `state` is the attempt it
        started and that the identity token's `nonce` claim is the one it
        minted, then signs in with the token through `POST /auth/login`
        (`auth_jwt_type: google`), which verifies the signature and the
        audience.

        `state` is opaque except for the optional `platform` claim shared
        with the Apple callback: base64url JSON with a `platform` key picks
        the scheme (`android` → `ur://`, `windows` and `linux` →
        `urnetwork://`); without it the android scheme is used. Google's own
        `error` (e.g. `access_denied`) is passed through; a failed exchange
        or a missing client configuration comes back as `error` too
        (`not_configured` when the vault has no `sign_in_oauth`).
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
          description: The attempt's state, echoed by Google untouched.
        - in: query
          name: code
          schema:
            type: string
          description: Google's authorization code, exchanged here for the identity token.
        - in: query
          name: error
          schema:
            type: string
          description: Google's error, e.g. `access_denied`.
      responses:
        '302':
          description: Redirect to the app's `<scheme>://oauth/google?…` return url.
          headers:
            Location:
              schema:
                type: string
              example: 'urnetwork://oauth/google?state=eyJwbGF0Zm9ybSI6IndpbmRvd3MiLCJ0b2tlbiI6IjEyMyJ9&id_token=eyJ...'
        '400':
          description: No `state`.
        '405':
          description: Not a `GET`.
  /auth/code-login:
    post:
      description: |
        Authenticate with an auth code.
        The returned session is tied to the session that created the auth code,
