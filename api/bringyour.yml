  /account/payments:
    get:
      description: |
        Retrieves list of account payments
      operationId: Account Get Payouts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetNetworkAccountPaymentsResult"

  /account/wallet:
    post:
      description: |
        Create a new wallet for your network. You can then use it as a payout wallet
