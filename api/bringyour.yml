          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        id_token:
          type: string
        scope:
          type: string

    OauthError:
      type: object
      description: The rfc 6749 section 5.2 error envelope.
      properties:
        error:
          type: string
        error_description:
          type: string

    OauthClientMetadata:
      type: object
      properties:
        client_id:
          type: string
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        application_type:
          type: string
        redirect_uris:
          type: array
          items:
            type: string
        scope:
          type: string
        grant_types:
          type: array
          items:
            type: string

    OauthRegisteredClient:
      type: object
      properties:
