    AuthNetworkClientArgs:
      type: object
      properties:
        client_id:
          description: udid. Optional. If this is given, it must currently exist in the network. Omit this to assign a new client id.
          type: string
        source_client_id:
          description: udid. Optional. The source client id when creating an ancillary client id.
          type: string
        description:
          description: If this is a new device, sets the device name to the description of the device.
          type: string
        device_spec:
          description: If this is a new device, sets the device spec.
          type: string
        time_zone:
          description: |
            Optional. The device's IANA time zone (e.g. America/Chicago), used
            only to place the onboarding campaign's emails in the user's local
            day (08:00-21:00 local); never stored on the client. Every app
            sends it on each auth-client call; the latest wins.
          type: string
        locale:
          description: |
            Optional. The device's BCP 47 locale ("de-DE"). Selects the onboarding
            campaign's template language, falling back to English. Same rules as
            time_zone.
          type: string
        roles:
          description: Optional. |
            Identity roles assigned to the client at creation, immutable after. |
            Only a network session may set these; when omitted, the session's own roles are inherited. |
            The values have no meaning to the network.
          type: array
          items:
            type: string
        principal:
          description: Optional. |
            Identity principal assigned to the client at creation, immutable after. |
            Only a network session may set this; when omitted, the session's own principal is inherited.
          type: string
        # the proxy auth will be the by_client_jwt as username, no password
        proxy_config:
          description: Optional. |
            Set if the intended use case of the client is cloud proxy. |
            Note local traffic is not allowed on the cloud proxy. A destination must be set via the SDK.
          type: object
          properties:
            lock_caller_ip:
              description: Optional. |
                Allow only the caller's IP subnet to access the proxy.
              type: boolean
            lock_ip_list:
              description: Optional. |
                Allow only IPs/subnets in the list to access the proxy. |
                The IPs/subnets are converted to the internal IP subnet width.
              type: array
              items:
                type: string
            https_require_auth:
              description: Optional. |
                If the client supports ECH, this is not needed, since the HTTP proxy URL will itself be the auth.
              type: boolean
            enable_wg:
              description: Optional. |
                If enabled, a WireGuard configuration will be created for the proxy.
              type: boolean
            initial_device_state:
              description: Optional. |
                Whenever the device is created, it will be set up with this initial state.
                To configure the device beyond the initial state, the SDK ProxyDevice must be used.
                Note that the SDK ProxyDevice must reconfigure the device each time it receives a change notice.
              type: object
              properties:
                country_code:
                  description: Optional. Use one of country_code or location
                  type: string
                location:
                  description: Optional. Use one of country_code or location
                  type: object
                  properties:
                    connect_location_id:
                      type: object
                      properties:
                        client_id:
                          description: udid. Optional.
                          type: string
                        location_id:
                          description: udid. Optional.
                          type: string
                        location_group_id:
                          description: udid. Optional.
                          type: string
                        best_available:
                          description: udid. Optional.
                          type: boolean
                    name:
                      type: string
                    location_type:
                      type: string
                      oneOf:
                        - title: LocationTypeCountry
                          const: country
                        - title: LocationTypeRegion
                          const: region
                        - title: LocationTypeCity
                          const: city
                    provider_count:
                      type: integer
                    promoted:
                      type: boolean
                    match_distance:
                      type: integer
                    city:
                      type: string
                    region:
                      type: string
                    country:
                      type: string
                    country_code:
                      type: string
                    city_location_id:
                      description: udid. Optional.
                      type: string
                    region_location_id:
                      description: udid. Optional.
                      type: string
                    country_location_id:
                      description: udid. Optional.
                      type: string
                    stable:
                      type: boolean
                    strong_privacy:
                      type: boolean
                    network_peer:
                      description: |
                        Marks the location as one of the network's own trusted
                        peers, which egresses under ProvideModeNetwork. It is
                        explicit state: a fixed client id alone does not imply
                        a trusted peer, since it can be a public exit.
                      type: boolean
                performance_profile:
                  type: object
                  properties:
                    allow_direct:
                      description: Setting this exposes the real source IP to the provider.
                      type: boolean
                    post_quantum_encryption:
                      description: |
                        Opportunistic post-quantum end-to-end encryption to
                        providers that support it; providers without support
                        fall back to plaintext at this layer.
                      type: boolean
                    window_type:
                      description: Optional. The default is "quality"
                      type: string
                      oneOf:
                        - title: WindowTypeQuality
                          const: quality
                        - title: WindowTypeSpeed
                          const: speed
                    window_size:
                      type: object
                      properties:
                        window_size_min:
                          type: integer
                        window_size_min_p2p_only:
                          description: |
                            The minimumum number of items in the windows that must be connected via p2p only.
                            Leave 0 for default behavior.
                          type: integer
                        window_size_max:
                          description: Inclusive, soft limit. |
                            When `window_size_max==window_size_min`, a special fixed size mode is enabled.
                          type: integer
                        window_size_hard_max:
                          description: Leave 0 to disable (no hard limit)
                          type: integer
                        window_size_reconnect_scale:
                          description: Clients per source per stream
                          type: number
                        keep_healthiest_count:
                          description: Leave 0 to disable
                          type: integer
                        ulimit:
                          description: Leave 0 to disable (no limit)
                          type: integer
                dns_resolver_settings:
                  description: |
                    Optional. How the proxy device resolves DNS. DoH urls are
                    queried as RFC 8484 wire format, and each must present an
                    IP-SAN certificate when addressed by IP.
                  type: object
                  properties:
                    enable_remote_doh:
                      type: boolean
                    enable_local_doh:
                      type: boolean
                    enable_remote_dns:
                      type: boolean
                    enable_local_dns:
                      type: boolean
                    dns_upgrade_mask_address:
                      description: |
                        A stand-in destination for the platform's plain DNS
                        configuration while the upgrade mux intercepts
                        UDP/TCP :53. It is not an upstream resolver.
                      type: string
                    remote_doh_urls_ipv4:
                      type: array
                      items:
                        type: string
                    remote_doh_urls_ipv6:
                      type: array
                      items:
                        type: string
                    local_doh_urls_ipv4:
                      type: array
                      items:
                        type: string
                    local_doh_urls_ipv6:
                      type: array
                      items:
                        type: string
                    remote_dns_ipv4:
                      type: array
                      items:
                        type: string
                    remote_dns_ipv6:
                      type: array
                      items:
                        type: string
                    local_dns_ipv4:
                      type: array
                      items:
                        type: string
                    local_dns_ipv6:
                      type: array
                      items:
                        type: string

    AuthNetworkClientResult:
      type: object
      properties:
        by_client_jwt:
          type: string
        client_id:
          description: udid
          type: string
        # the returned proxy urls are valid as long as the client is not removed
        proxy_config_result:
          description: |
            The following proxy URLs and auths may be used:
            | URL | Auth |
            |-----|------|
            | https://<auth_token>.<proxy_host>:<https_proxy_port> | no auth needed when the client connects with TLS |
            | https://<proxy_host>:<https_proxy_port> | use HTTP Proxy-Authorization Basic with `access_token` as the username (empty pass), or Bearer with `access_token` as the bearer token |
            | http://<proxy_host>:<http_proxy_port> | use HTTP Proxy-Authorization Basic with `access_token` as the username (empty pass), or Bearer with `access_token` as the bearer token |
            | tcp://<proxy_host>:<socks_proxy_port> | use `access_token` as the username (empty pass) |
            | wg://<proxy_host>:<wg_proxy_port> | use `wg_config.config` as the full WireGuard config file content, which contains all the necessary keys |
          allOf:
            - type: object
              properties:
                keepalive_seconds:
                  description: |
                    The proxy url will be valid until the client is removed.
                    However, to keep the device and state in memory,
                    the proxy must receive a message at least once per this interval.
                    The SDK ProxyDevice will automatically send a heartbeat with this many seconds.
                    If the proxy is removed from memmory, the next call to the proxy will
                    create a new device set up to the `initial_device_state` (if present).
                  type: integer
            - $ref: "#/components/schemas/ProxyClient"

        error:
          type: object
          properties:
            client_limit_exceeded:
              description: A hard cap or a rate limit was hit.
              type: boolean
            upgrade_required:
              description: |
                The network is at its plan's limit for concurrent connected
                top-level clients. Unlike `client_limit_exceeded` this is a
                plan limit, not a hard cap: surface an upgrade prompt. It is
                the flag the x402 inline-payment round trip keys off.
              type: boolean
            message:
              type: string

